name: Public V0 post-publish verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-v0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-v0:
    name: Published desktop, mobile, network and offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-v0-browsers
        run: bunx playwright install --with-deps chromium

      - name: Probe published search state
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-v0-browsers
          BASE_URL: https://arar-buluruz.lovable.app
        run: bun scripts/public-search-probe.ts

      - name: Verify published V0
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/public-v0-browsers
          BASE_URL: https://arar-buluruz.lovable.app
        run: timeout 180s bun scripts/public-v0-verify.ts

      - name: Upload public verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-v0-post-publish-evidence
          path: test-results/public-v0/*.png
          if-no-files-found: warn
          retention-days: 7
