name: Product Finding Phase 1 preflight

on:
  push:
    branches:
      - agent/product-finding-integrity-phase1

permissions:
  contents: read

concurrency:
  group: product-finding-phase1-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Prettier, lint, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Prettier check
        run: bunx prettier --check .
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test:unit
      - name: Build
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

  local-db:
    name: Local migrations and pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0
      - name: Restore canonical Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Verify local-only boundary
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
      - name: Enable Auth and Storage in ephemeral runner only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          config = path.read_text(encoding="utf-8")
          for old, new in {
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }.items():
              if old not in config:
                  raise SystemExit(f"Expected repository setting not found: {old!r}")
              config = config.replace(old, new, 1)
          path.write_text(config, encoding="utf-8")
          PY
      - name: Start isolated local Supabase
        run: supabase start -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed
      - name: Seed private Storage bucket
        run: supabase seed buckets --local
      - name: Run pgTAP database and RLS tests
        run: supabase test db
      - name: Run trusted-photo role probes
        run: bash scripts/trusted-photo-db-role-probes.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  self-host:
    name: Pinned self-host migration rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: disable
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0
      - name: Restore canonical Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rclone
          rclone version
      - name: Verify synthetic-only boundary
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -f ops/self-hosted/upstream.lock
      - name: Enable isolated source ports, Auth and Storage
        shell: bash
        run: |
          python3 - <<'PY'
          import socket
          from pathlib import Path
          def reserve(excluded):
              while True:
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                      sock.bind(("127.0.0.1", 0))
                      port = sock.getsockname()[1]
                  if port not in excluded:
                      excluded.add(port)
                      return port
          selected = set()
          api_port, db_port, shadow_port = reserve(selected), reserve(selected), reserve(selected)
          path = Path("supabase/config.toml")
          config = path.read_text(encoding="utf-8")
          replacements = {
              "[api]\nenabled = true\nport = 54321": f"[api]\nenabled = true\nport = {api_port}",
              "[db]\nport = 54322\nshadow_port = 54320": f"[db]\nport = {db_port}\nshadow_port = {shadow_port}",
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }
          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f"Expected repository setting not found: {old!r}")
              config = config.replace(old, new, 1)
          path.write_text(config, encoding="utf-8")
          PY
      - name: Run self-host migration and rollback rehearsal
        run: bash scripts/self-hosted-migration-rehearsal.sh

  managed:
    name: Managed synthetic provider portability rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: require
      MANAGED_SUPABASE_PROJECT_REF: rzosrvenlvhijeckmwyc
      MANAGED_SUPABASE_DB_URL: ${{ secrets.ARAR_SUPABASE_DB_URL }}
      MANAGED_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
      MANAGED_SUPABASE_S3_ENDPOINT: https://rzosrvenlvhijeckmwyc.storage.supabase.co/storage/v1/s3
      MANAGED_SUPABASE_S3_REGION: eu-central-1
      MANAGED_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.ARAR_SUPABASE_S3_ACCESS_KEY_ID }}
      MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARAR_SUPABASE_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0
      - name: Restore canonical Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install PostgreSQL client and rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client rclone
          psql --version
          rclone version
      - name: Verify dedicated synthetic-only credentials
        shell: bash
        run: |
          test -n "${MANAGED_SUPABASE_DB_URL:-}"
          test -n "${MANAGED_SUPABASE_ANON_KEY:-}"
          test -n "${MANAGED_SUPABASE_S3_ACCESS_KEY_ID:-}"
          test -n "${MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY:-}"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test "$MANAGED_SUPABASE_PROJECT_REF" = "rzosrvenlvhijeckmwyc"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "jlbsoraqnlricbyagxdk"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "gwgrwwvaiizfsqaacnhf"
          echo "::add-mask::$MANAGED_SUPABASE_DB_URL"
          echo "::add-mask::$MANAGED_SUPABASE_ANON_KEY"
          echo "::add-mask::$MANAGED_SUPABASE_S3_ACCESS_KEY_ID"
          echo "::add-mask::$MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY"
      - name: Run managed provider invariants and portability proof
        run: bash scripts/managed-supabase-migration-rehearsal.sh
      - name: Verify repository copy was not polluted
        if: always()
        run: git diff --exit-code
