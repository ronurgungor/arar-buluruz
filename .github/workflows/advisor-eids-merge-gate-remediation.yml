name: Advisor EIDS merge-gate remediation

on:
  push:
    branches:
      - agent/product-finding-integrity-phase1
    paths:
      - .github/workflows/advisor-eids-merge-gate-remediation.yml

permissions:
  contents: write

jobs:
  patch-self-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/product-finding-integrity-phase1
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Apply exact seller EIDS scope patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/lib/stage1-self-service-server.ts")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import {\n  hasStage1ProductFields,\n  parseStage1ProductFields,\n  parseStoredProductFields,\n  Stage1ProductInputError,\n  transitionStoredProductFields,\n} from "./stage1-product-fields";\n',
                  'import { resolveProductComplianceScope, type ProductType } from "./product-finding-contract";\nimport {\n  hasStage1ProductFields,\n  parseStage1ProductFields,\n  parseStoredProductFields,\n  Stage1ProductInputError,\n  transitionStoredProductFields,\n} from "./stage1-product-fields";\n',
              ),
              (
                  '  stage1ConditionSchema,\n  stage1E164Schema,\n  type Stage1SubmissionResponse,\n',
                  '  stage1ConditionSchema,\n  stage1E164Schema,\n  type Stage1Category,\n  type Stage1SubmissionResponse,\n',
              ),
              (
                  'function assertEidsPublicationAllowed(\n  category: string,\n  request: Request,\n  config: BackendConfig,\n): void {\n  if (category !== "vehicle" && category !== "real-estate") return;\n',
                  'function assertEidsPublicationAllowed(\n  category: Stage1Category,\n  productType: ProductType | null,\n  request: Request,\n  config: BackendConfig,\n): void {\n  if (resolveProductComplianceScope({ category, productType }) === "ordinary") return;\n',
              ),
              (
                  '  const config = readBackendConfig();\n  assertEidsPublicationAllowed(category, request, config);\n  const sellerSession = await resolveSellerSession(config, request);\n',
                  '  const config = readBackendConfig();\n  assertEidsPublicationAllowed(category, product.productType, request, config);\n  const sellerSession = await resolveSellerSession(config, request);\n',
              ),
              (
                  '  const category = stage1CategorySchema.parse(requiredString(form, "category", 3, 32));\n  assertEidsPublicationAllowed(category, request, config);\n  const product = hasStage1ProductFields(form)\n    ? parseStage1ProductFields(form, category)\n    : transitionStoredProductFields({\n        previousCategory,\n        previousProductType: previousProduct.productType,\n        previousAttributes: previousProduct.productAttributes,\n        nextCategory: category,\n      });\n',
                  '  const category = stage1CategorySchema.parse(requiredString(form, "category", 3, 32));\n  const product = hasStage1ProductFields(form)\n    ? parseStage1ProductFields(form, category)\n    : transitionStoredProductFields({\n        previousCategory,\n        previousProductType: previousProduct.productType,\n        previousAttributes: previousProduct.productAttributes,\n        nextCategory: category,\n      });\n  assertEidsPublicationAllowed(category, product.productType, request, config);\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one seller patch target, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

          bun install --frozen-lockfile
          bunx prettier --write \
            src/lib/product-finding-contract.ts \
            src/lib/product-finding-contract.test.ts \
            src/lib/stage1-self-service-server.ts \
            src/lib/stage1-moderation-server.ts \
            src/lib/stage1-moderation-server.test.ts
          bun run lint
          bun run test:unit
          git diff --check

      - name: Commit verified patch and remove scaffold
        shell: bash
        run: |
          git rm .github/workflows/advisor-eids-merge-gate-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/product-finding-contract.ts \
            src/lib/product-finding-contract.test.ts \
            src/lib/stage1-self-service-server.ts \
            src/lib/stage1-moderation-server.ts \
            src/lib/stage1-moderation-server.test.ts
          git commit -m "Scope seller EIDS gate by product type"
          git push origin HEAD:agent/product-finding-integrity-phase1
