name: Temporary activation formatter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out activation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/first-real-listing-readiness
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format activation files only
        shell: bash
        run: |
          bunx prettier --write \
            scripts/build-with-profile-assets.ts \
            scripts/hosted-pilot-operator-browser-e2e.ts \
            scripts/pilot-operator-browser-e2e.ts \
            scripts/pilot-rc-artifact-e2e.ts \
            src/build-profiles/pilot/public-operator-info.ts \
            src/lib/pilot-operator-server.ts \
            src/lib/place-provider-traffic-log.ts \
            src/lib/place-provider-traffic-log.test.ts \
            src/routes/kurucu.tsx \
            src/routes-pilot/gizlilik.tsx \
            src/routes-pilot/ilan-ver.tsx \
            'src/routes-pilot/ilan.$id.tsx' \
            src/routes-pilot/ilan-kurallari.tsx \
            src/routes-pilot/iletisim.tsx \
            'src/routes-pilot/sikayet.$id.tsx'
          git diff --check

      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            scripts/build-with-profile-assets.ts \
            scripts/hosted-pilot-operator-browser-e2e.ts \
            scripts/pilot-operator-browser-e2e.ts \
            scripts/pilot-rc-artifact-e2e.ts \
            src/build-profiles/pilot/public-operator-info.ts \
            src/lib/pilot-operator-server.ts \
            src/lib/place-provider-traffic-log.ts \
            src/lib/place-provider-traffic-log.test.ts \
            src/routes/kurucu.tsx \
            src/routes-pilot/gizlilik.tsx \
            src/routes-pilot/ilan-ver.tsx \
            'src/routes-pilot/ilan.$id.tsx' \
            src/routes-pilot/ilan-kurallari.tsx \
            src/routes-pilot/iletisim.tsx \
            'src/routes-pilot/sikayet.$id.tsx'
          git commit -m 'Format activation readiness changes'
          git push origin HEAD:agent/first-real-listing-readiness
