name: Backend prep diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Capture canonical Prettier diff
        shell: bash
        run: |
          mkdir -p diagnostic-output
          bun run format
          git diff -- . ':!bun.lock' > diagnostic-output/prettier.diff
      - name: Upload formatting diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prettier-diagnostic
          path: diagnostic-output/prettier.diff
          retention-days: 1

  pgtap-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
      - name: Enable local Auth only in runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace("[auth]\nenabled = false", "[auth]\nenabled = true", 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Start local database stack
        run: >-
          supabase start
          -x realtime,storage-api,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor
      - run: supabase db reset --local --no-seed
      - name: Capture pgTAP output
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostic-output
          set -o pipefail
          supabase test db 2>&1 | tee diagnostic-output/pgtap.log
      - name: Upload pgTAP diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pgtap-diagnostic
          path: diagnostic-output/pgtap.log
          if-no-files-found: error
          retention-days: 1
      - if: always()
        run: supabase stop --no-backup
