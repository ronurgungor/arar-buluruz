name: Gate 1 lock refresh

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate1-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    name: Generate canonical Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Generate lockfile with Bun only
        run: |
          bun --version
          bun install --ignore-scripts
          git diff --exit-code -- package.json
          git diff --check -- bun.lock
          test "$(bun -e 'console.log(require("./package.json").devDependencies.playwright)')" = "1.55.0"
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test ! -e yarn.lock
          test ! -e pnpm-lock.yaml

      - name: Upload generated Bun lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate1-bun-lock
          path: bun.lock
          if-no-files-found: error
          retention-days: 1
