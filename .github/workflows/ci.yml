name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, unit test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Report Bun version
        run: bun --version

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

  gate1-database:
    name: Gate 1 local migration, RLS, REST and browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify Bun-only package boundary
        run: |
          test "$(bun -e 'console.log(require("./package.json").devDependencies.playwright)')" = "1.55.0"
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test ! -e yarn.lock
          test ! -e pnpm-lock.yaml

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify canonical tool versions
        run: |
          test "$(bun --version)" = "1.3.14"
          supabase --version

      - name: Verify local-only test boundary
        shell: bash
        run: |
          if [[ -f supabase/.temp/project-ref ]]; then
            echo "A linked Supabase project-ref is prohibited in Gate 1 CI."
            exit 1
          fi
          if [[ -n "${SUPABASE_ACCESS_TOKEN:-}" || -n "${SUPABASE_DB_PASSWORD:-}" ]]; then
            echo "Remote Supabase credentials are prohibited in Gate 1 CI."
            exit 1
          fi

      - name: Enable GoTrue and Storage only in the ephemeral runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          config_path = Path("supabase/config.toml")
          config = config_path.read_text(encoding="utf-8")
          replacements = {
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }

          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f"Expected fail-closed repository setting not found: {old!r}")
              config = config.replace(old, new, 1)

          config_path.write_text(config, encoding="utf-8")
          PY

          git diff --exit-code -- . ':(exclude)supabase/config.toml'
          git diff --check -- supabase/config.toml
          grep -A4 '^\[storage\]$' supabase/config.toml

      - name: Start isolated local Supabase stack with Storage
        run: >-
          supabase start
          -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild database from migrations
        run: supabase db reset --local --no-seed

      - name: Run pgTAP database and RLS tests
        run: supabase test db

      - name: Run isolated trusted-photo role probes and DB health sentinel
        run: bash scripts/trusted-photo-db-role-probes.sh

      - name: Seed transient integration fixtures
        shell: bash
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          if [[ -z "$db_container" ]]; then
            echo "Local Supabase Postgres container was not found."
            exit 1
          fi

          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          insert into public.listings (
            id,
            title,
            description,
            price_amount,
            province,
            district,
            seller_display_name,
            search_keywords,
            contact_channel,
            contact_e164,
            contact_verified_at,
            contact_verification_method,
            publication_instruction_at,
            status,
            published_at,
            expires_at
          )
          values
            (
              '00000000-0000-4000-8000-000000000101',
              'Visible integration listing',
              'This active listing must pass through the local public application adapter.',
              1250,
              'Tekirdag',
              'Corlu',
              'Pilot Seller',
              array['visible', 'integration'],
              'whatsapp',
              '+12025550123',
              now() - interval '2 hours',
              'whatsapp_same_number',
              now() - interval '90 minutes',
              'published',
              now() - interval '1 hour',
              now() + interval '1 day'
            ),
            (
              '00000000-0000-4000-8000-000000000102',
              'Draft integration listing',
              'This draft listing must remain hidden through the public application adapter.',
              1500,
              'Tekirdag',
              'Corlu',
              'Pilot Seller',
              array['draft', 'integration'],
              null,
              null,
              null,
              null,
              null,
              'draft',
              null,
              null
            ),
            (
              '00000000-0000-4000-8000-000000000103',
              'Expired integration listing',
              'This expired listing must remain hidden through the public application adapter.',
              1750,
              'Tekirdag',
              'Corlu',
              'Pilot Seller',
              array['expired', 'integration'],
              'phone',
              '+12025550124',
              now() - interval '3 days',
              'manual_callback',
              now() - interval '2 days 12 hours',
              'published',
              now() - interval '2 days',
              now() - interval '1 day'
            );
          SQL

      - name: Run application-to-RLS REST integration
        shell: bash
        run: |
          status_env="$(supabase status -o env)"

          extract_status_value() {
            local value
            value="$(printf '%s\n' "$status_env" | grep "^$1=" | head -n 1)"
            value="${value#*=}"
            value="${value#\"}"
            value="${value%\"}"
            printf '%s' "$value"
          }

          api_url="$(extract_status_value API_URL)"
          anon_key="$(extract_status_value ANON_KEY)"

          if [[ -z "$api_url" || -z "$anon_key" ]]; then
            echo "Documented local Supabase API_URL or ANON_KEY was not available."
            exit 1
          fi

          LOCAL_SUPABASE_URL="$api_url" \
          LOCAL_SUPABASE_PUBLIC_KEY="$anon_key" \
            bun scripts/gate1-local-integration.ts

      - name: Install Chromium with Bun-managed Playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gate1-browsers
        run: bunx playwright install --with-deps chromium

      - name: Run focused desktop and mobile browser E2E
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/gate1-browsers
        run: |
          status_env="$(supabase status -o env)"

          extract_status_value() {
            local value
            value="$(printf '%s\n' "$status_env" | grep "^$1=" | head -n 1)"
            value="${value#*=}"
            value="${value#\"}"
            value="${value%\"}"
            printf '%s' "$value"
          }

          api_url="$(extract_status_value API_URL)"
          anon_key="$(extract_status_value ANON_KEY)"

          if [[ -z "$api_url" || -z "$anon_key" ]]; then
            echo "Documented local Supabase API_URL or ANON_KEY was not available."
            exit 1
          fi

          VITE_LISTINGS_SOURCE=supabase \
          VITE_SUPABASE_URL="$api_url" \
          VITE_SUPABASE_ANON_KEY="$anon_key" \
            bun run build

          VITE_LISTINGS_SOURCE=supabase \
          VITE_SUPABASE_URL="$api_url" \
          VITE_SUPABASE_ANON_KEY="$anon_key" \
            bun run dev -- --host 127.0.0.1 --port 4173 --strictPort \
              >"$RUNNER_TEMP/gate1-browser-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ara >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$RUNNER_TEMP/gate1-browser-server.log"
              exit 1
            fi
            sleep 1
          done

          BASE_URL="http://127.0.0.1:4173" bun scripts/gate1-browser-e2e.ts

          find test-results/gate1-browser -maxdepth 1 -type f -name '*.png' -print -exec file {} \;

      - name: Upload Gate 1 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate1-browser-e2e
          path: |
            test-results/gate1-browser/*.png
            ${{ runner.temp }}/gate1-browser-server.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop and remove local Supabase data
        if: always()
        run: supabase stop --no-backup
