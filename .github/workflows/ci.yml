name: Gate 1 lock commit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gate1-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lock:
    name: Commit canonical Bun lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Gate 1 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/gate1-persistence-rls
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Generate and commit Bun lockfile
        run: |
          bun --version
          bun install --ignore-scripts
          git diff --exit-code -- package.json
          git diff --check -- bun.lock
          test "$(bun -e 'console.log(require("./package.json").devDependencies.playwright)')" = "1.55.0"
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test ! -e yarn.lock
          test ! -e pnpm-lock.yaml

          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Update Bun lock for Playwright"
          git push origin HEAD:agent/gate1-persistence-rls
