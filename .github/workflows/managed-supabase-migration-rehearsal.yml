name: Managed Supabase migration rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/managed-supabase-migration-rehearsal.yml"
      - "scripts/managed-supabase-migration-rehearsal.sh"
      - "scripts/export-managed-application-backup.sh"
      - "scripts/materialize-migration-photo-fixture.ts"
      - "scripts/storage-object-backup-restore.sh"
      - "scripts/migration-photo-fixture.ts"
      - "scripts/pilot-rc-artifact-boundary-check.sh"
      - "ops/self-hosted/restore-verification.sql"
      - "vite.config.ts"
      - "ops/self-hosted/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Dedicated arar-buluruz-synthetic-dev project ref (never a Tarladan ref)"
        required: true
        type: string
      s3_region:
        description: "Managed Supabase Storage S3 region"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: managed-supabase-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-check:
    name: Managed provider proof static boundary check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify managed provider proof scripts and secret boundary
        shell: bash
        run: |
          bash -n scripts/managed-supabase-migration-rehearsal.sh
          bash -n scripts/export-managed-application-backup.sh
          bash -n scripts/storage-object-backup-restore.sh
          bash -n scripts/pilot-rc-artifact-boundary-check.sh

          bun scripts/materialize-migration-photo-fixture.ts "${RUNNER_TEMP}/managed-fixture.webp" > "${RUNNER_TEMP}/managed-fixture.json"
          test "$(wc -c < "${RUNNER_TEMP}/managed-fixture.webp" | tr -d ' ')" = "72"
          test "$(sha256sum "${RUNNER_TEMP}/managed-fixture.webp" | awk '{print $1}')" = "fd89cface8e12174fb1c6e78c0a8b0b26be925820eed38713ff1d921d5f969df"

          bun build scripts/migration-photo-fixture.ts \
            --target=bun \
            --outdir "${RUNNER_TEMP}/migration-photo-fixture-build"

          test ! -f supabase/.temp/project-ref
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!bun.lock' ':!.github/workflows/*.yml'; then
            echo "Possible committed secret material detected."
            exit 1
          fi

          grep -Fq 'canonical_migration_versions' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq 'ops/self-hosted/restore-verification.sql' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq 'Pending managed photo signing unexpectedly succeeded.' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq 'verify-source-target' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq 'Managed source contains orphan private photo metadata after rehearsal.' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq "has_table_privilege('anon', 'public.listings', 'INSERT')" ops/self-hosted/restore-verification.sql
          grep -Fq 'Public can sign active listing photo objects' ops/self-hosted/restore-verification.sql

          for retired_harness in \
            scripts/hosted-synthetic-rc-proof.sh \
            scripts/hosted-pilot-operator-browser-e2e.ts \
            scripts/hosted-rc-transport-shim.ts \
            scripts/pilot-rc-artifact-e2e.ts; do
            test ! -e "$retired_harness"
          done

          if git grep -nE 'scripts/(hosted-synthetic-rc-proof\.sh|hosted-pilot-operator-browser-e2e\.ts|hosted-rc-transport-shim\.ts|pilot-rc-artifact-e2e\.ts)' -- . ':!.github/workflows/managed-supabase-migration-rehearsal.yml'; then
            echo "Retired hosted proof harness still has references outside the static retirement guard."
            exit 1
          fi

  managed-rehearsal:
    name: Dedicated managed Free → pinned self-host DB + Storage rehearsal
    if: github.event_name == 'workflow_dispatch'
    needs: contract-check
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: require
      MANAGED_SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      MANAGED_SUPABASE_DB_URL: ${{ secrets.ARAR_SUPABASE_DB_URL }}
      MANAGED_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
      MANAGED_SUPABASE_S3_ENDPOINT: https://${{ inputs.project_ref }}.storage.supabase.co/storage/v1/s3
      MANAGED_SUPABASE_S3_REGION: ${{ inputs.s3_region }}
      MANAGED_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.ARAR_SUPABASE_S3_ACCESS_KEY_ID }}
      MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARAR_SUPABASE_S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client and rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client rclone
          psql --version
          rclone version

      - name: Verify dedicated synthetic-only credentials and hard exclusions
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"
          test -n "${MANAGED_SUPABASE_PROJECT_REF:-}"
          test -n "${MANAGED_SUPABASE_DB_URL:-}"
          test -n "${MANAGED_SUPABASE_ANON_KEY:-}"
          test -n "${MANAGED_SUPABASE_S3_ACCESS_KEY_ID:-}"
          test -n "${MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY:-}"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"

          case "$MANAGED_SUPABASE_PROJECT_REF" in
            jlbsoraqnlricbyagxdk|gwgrwwvaiizfsqaacnhf)
              echo "Refusing to run against a known Tarladan project ref."
              exit 1
              ;;
          esac

          echo "::add-mask::$MANAGED_SUPABASE_DB_URL"
          echo "::add-mask::$MANAGED_SUPABASE_ANON_KEY"
          echo "::add-mask::$MANAGED_SUPABASE_S3_ACCESS_KEY_ID"
          echo "::add-mask::$MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY"

          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!bun.lock' ':!.github/workflows/*.yml'; then
            echo "Possible committed secret material detected."
            exit 1
          fi

      - name: Run managed Free to exact pinned self-host migration and rollback rehearsal
        shell: bash
        run: bash scripts/managed-supabase-migration-rehearsal.sh

      - name: Verify repository copy was not polluted by rehearsal
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

  hosted-managed-proof:
    name: Dedicated hosted managed provider + portability proof
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: contract-check
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: require
      MANAGED_SUPABASE_PROJECT_REF: rzosrvenlvhijeckmwyc
      MANAGED_SUPABASE_DB_URL: ${{ secrets.ARAR_SUPABASE_DB_URL }}
      MANAGED_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
      MANAGED_SUPABASE_S3_ENDPOINT: https://rzosrvenlvhijeckmwyc.storage.supabase.co/storage/v1/s3
      MANAGED_SUPABASE_S3_REGION: eu-central-1
      MANAGED_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.ARAR_SUPABASE_S3_ACCESS_KEY_ID }}
      MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARAR_SUPABASE_S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client and rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client rclone
          psql --version
          rclone version
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"

      - name: Verify dedicated synthetic-only credentials and hard exclusions
        shell: bash
        run: |
          test -n "${MANAGED_SUPABASE_DB_URL:-}"
          test -n "${MANAGED_SUPABASE_ANON_KEY:-}"
          test -n "${MANAGED_SUPABASE_S3_ACCESS_KEY_ID:-}"
          test -n "${MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY:-}"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test "$MANAGED_SUPABASE_PROJECT_REF" = "rzosrvenlvhijeckmwyc"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "jlbsoraqnlricbyagxdk"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "gwgrwwvaiizfsqaacnhf"

          echo "::add-mask::$MANAGED_SUPABASE_DB_URL"
          echo "::add-mask::$MANAGED_SUPABASE_ANON_KEY"
          echo "::add-mask::$MANAGED_SUPABASE_S3_ACCESS_KEY_ID"
          echo "::add-mask::$MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY"

      - name: Run managed provider invariants and pinned portability proof
        shell: bash
        run: bash scripts/managed-supabase-migration-rehearsal.sh

      - name: Build current public pilot artifact without privileged credentials
        shell: bash
        run: |
          rm -rf .output
          (
            unset MANAGED_SUPABASE_DB_URL MANAGED_SUPABASE_S3_ACCESS_KEY_ID MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY
            unset PILOT_OPERATOR_SUPABASE_SERVICE_ROLE_KEY PILOT_SUBMISSION_SUPABASE_SERVICE_ROLE_KEY PILOT_SUBMISSION_CAPABILITY_SECRET
            ARAR_BUILD_PROFILE=pilot-rc \
            NITRO_PRESET=node-server \
            VITE_LISTINGS_SOURCE=supabase \
            VITE_SUPABASE_URL=https://synthetic.invalid \
            VITE_SUPABASE_ANON_KEY=synthetic-public-key \
              bun run build
          )

      - name: Verify current public artifact privilege boundary
        shell: bash
        run: bash scripts/pilot-rc-artifact-boundary-check.sh

      - name: Verify repository copy was not polluted
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
