name: Managed Supabase migration rehearsal

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/managed-supabase-migration-rehearsal.yml"
      - "scripts/managed-supabase-migration-rehearsal.sh"
      - "scripts/export-managed-application-backup.sh"
      - "scripts/materialize-migration-photo-fixture.ts"
      - "scripts/storage-object-backup-restore.sh"
      - "scripts/migration-photo-fixture.ts"
      - "scripts/hosted-rc-transport-shim.ts"
      - "scripts/hosted-pilot-operator-browser-e2e.ts"
      - "scripts/pilot-rc-artifact-e2e.ts"
      - "scripts/hosted-synthetic-rc-proof.sh"
      - "src/routes/giris.tsx"
      - "src/routes/gizlilik.tsx"
      - "public/offline.html"
      - "public/sw.js"
      - "public/manifest.webmanifest"
      - "vite.config.ts"
      - "ops/self-hosted/**"
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Dedicated arar-buluruz-synthetic-dev project ref (never a Tarladan ref)"
        required: true
        type: string
      s3_region:
        description: "Managed Supabase Storage S3 region"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: managed-supabase-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract-check:
    name: Managed rehearsal and hosted RC static boundary check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify managed rehearsal scripts and secret boundary
        shell: bash
        run: |
          bash -n scripts/managed-supabase-migration-rehearsal.sh
          bash -n scripts/export-managed-application-backup.sh
          bash -n scripts/storage-object-backup-restore.sh
          bash -n scripts/hosted-synthetic-rc-proof.sh
          bun scripts/materialize-migration-photo-fixture.ts "${RUNNER_TEMP}/managed-fixture.webp" > "${RUNNER_TEMP}/managed-fixture.json"
          test "$(wc -c < "${RUNNER_TEMP}/managed-fixture.webp" | tr -d ' ')" = "72"
          test "$(sha256sum "${RUNNER_TEMP}/managed-fixture.webp" | awk '{print $1}')" = "fd89cface8e12174fb1c6e78c0a8b0b26be925820eed38713ff1d921d5f969df"

          bun build scripts/hosted-rc-transport-shim.ts \
            --target=bun \
            --outfile "${RUNNER_TEMP}/hosted-rc-shim.js"
          bun build scripts/hosted-pilot-operator-browser-e2e.ts \
            --target=bun \
            --external playwright \
            --outfile "${RUNNER_TEMP}/hosted-operator-e2e.js"
          bun build scripts/pilot-rc-artifact-e2e.ts \
            --target=bun \
            --external playwright \
            --outfile "${RUNNER_TEMP}/pilot-rc-artifact-e2e.js"

          test ! -f supabase/.temp/project-ref
          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!bun.lock' ':!.github/workflows/*.yml'; then
            echo "Possible committed secret material detected."
            exit 1
          fi

          grep -Fq 'PGSSLMODE=require' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq '127.0.0.1:15432:5432' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq '127.0.0.1:18000' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq 'db rest imgproxy storage meta studio api-gw' scripts/managed-supabase-migration-rehearsal.sh
          grep -Fq 'supabase-auth realtime-dev.supabase-realtime supabase-edge-functions supabase-pooler' scripts/managed-supabase-migration-rehearsal.sh

          grep -Fq 'rzosrvenlvhijeckmwyc' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'jlbsoraqnlricbyagxdk' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'gwgrwwvaiizfsqaacnhf' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'hostname: "127.0.0.1"' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'Browser-origin requests are forbidden.' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'PILOT_OPERATOR_SUPABASE_SERVICE_ROLE_KEY="$shim_token"' scripts/hosted-synthetic-rc-proof.sh
          ! grep -R -F 'HOSTED_RC_SHIM_TOKEN' src public vite.config.ts
          ! grep -R -F 'HOSTED_RC_DB_URL' src public vite.config.ts
          ! grep -R -F 'HOSTED_RC_S3_SECRET_ACCESS_KEY' src public vite.config.ts

  managed-rehearsal:
    name: Dedicated managed Free → pinned self-host DB + Storage rehearsal
    if: github.event_name == 'workflow_dispatch'
    needs: contract-check
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: require
      MANAGED_SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      MANAGED_SUPABASE_DB_URL: ${{ secrets.ARAR_SUPABASE_DB_URL }}
      MANAGED_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
      MANAGED_SUPABASE_S3_ENDPOINT: https://${{ inputs.project_ref }}.storage.supabase.co/storage/v1/s3
      MANAGED_SUPABASE_S3_REGION: ${{ inputs.s3_region }}
      MANAGED_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.ARAR_SUPABASE_S3_ACCESS_KEY_ID }}
      MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARAR_SUPABASE_S3_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client and rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client rclone
          psql --version
          rclone version

      - name: Verify dedicated synthetic-only credentials and hard exclusions
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"
          test -n "${MANAGED_SUPABASE_PROJECT_REF:-}"
          test -n "${MANAGED_SUPABASE_DB_URL:-}"
          test -n "${MANAGED_SUPABASE_ANON_KEY:-}"
          test -n "${MANAGED_SUPABASE_S3_ACCESS_KEY_ID:-}"
          test -n "${MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY:-}"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"

          case "$MANAGED_SUPABASE_PROJECT_REF" in
            jlbsoraqnlricbyagxdk|gwgrwwvaiizfsqaacnhf)
              echo "Refusing to run against a known Tarladan project ref."
              exit 1
              ;;
          esac

          echo "::add-mask::$MANAGED_SUPABASE_DB_URL"
          echo "::add-mask::$MANAGED_SUPABASE_ANON_KEY"
          echo "::add-mask::$MANAGED_SUPABASE_S3_ACCESS_KEY_ID"
          echo "::add-mask::$MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY"

          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!bun.lock' ':!.github/workflows/*.yml'; then
            echo "Possible committed secret material detected."
            exit 1
          fi

      - name: Run managed Free to exact pinned self-host migration and rollback rehearsal
        shell: bash
        run: bash scripts/managed-supabase-migration-rehearsal.sh

      - name: Verify repository copy was not polluted by rehearsal
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

  hosted-rc-proof:
    name: Dedicated hosted synthetic RC + pilot-rc browser proof
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: contract-check
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: require
      MANAGED_SUPABASE_PROJECT_REF: rzosrvenlvhijeckmwyc
      MANAGED_SUPABASE_DB_URL: ${{ secrets.ARAR_SUPABASE_DB_URL }}
      MANAGED_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
      MANAGED_SUPABASE_S3_ENDPOINT: https://rzosrvenlvhijeckmwyc.storage.supabase.co/storage/v1/s3
      MANAGED_SUPABASE_S3_REGION: eu-central-1
      MANAGED_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.ARAR_SUPABASE_S3_ACCESS_KEY_ID }}
      MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARAR_SUPABASE_S3_SECRET_ACCESS_KEY }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hosted-rc-browsers

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client and rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client rclone
          psql --version
          rclone version
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"

      - name: Verify dedicated credentials and hard exclusions
        shell: bash
        run: |
          test -n "${MANAGED_SUPABASE_DB_URL:-}"
          test -n "${MANAGED_SUPABASE_ANON_KEY:-}"
          test -n "${MANAGED_SUPABASE_S3_ACCESS_KEY_ID:-}"
          test -n "${MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY:-}"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test "$MANAGED_SUPABASE_PROJECT_REF" = "rzosrvenlvhijeckmwyc"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "jlbsoraqnlricbyagxdk"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "gwgrwwvaiizfsqaacnhf"

          echo "::add-mask::$MANAGED_SUPABASE_DB_URL"
          echo "::add-mask::$MANAGED_SUPABASE_ANON_KEY"
          echo "::add-mask::$MANAGED_SUPABASE_S3_ACCESS_KEY_ID"
          echo "::add-mask::$MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY"

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Establish canonical hosted managed baseline
        shell: bash
        run: bash scripts/managed-supabase-migration-rehearsal.sh

      - name: Run hosted founder journey and pilot-rc artifact proof
        shell: bash
        run: bash scripts/hosted-synthetic-rc-proof.sh

      - name: Verify repository copy was not polluted
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

      - name: Upload hosted RC browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hosted-synthetic-rc-evidence
          path: test-results/hosted-rc/*.png
          if-no-files-found: warn
          retention-days: 7
