name: Self-host migration rehearsal

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-rehearsal:
    name: Pinned self-host DB + Storage migration and rollback rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      # The pinned self-host Postgres endpoint is loopback-only and does not terminate TLS.
      # Supabase CLI 2.102.0 may drop sslmode from --db-url during its internal URL
      # round-trip, so use the libpq/pgx environment setting that survives that path.
      PGSSLMODE: disable

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install rclone for S3-compatible Storage migration
        shell: bash
        run: |
          if ! command -v rclone >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends rclone
          fi
          rclone version

      - name: Verify synthetic-only and zero-cost boundary
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test -f ops/self-hosted/upstream.lock
          grep -q '^SUPABASE_SELF_HOSTED_COMMIT=[0-9a-f]\{40\}$' ops/self-hosted/upstream.lock

          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!bun.lock' ':!.github/workflows/*.yml'; then
            echo "Possible committed secret material detected."
            exit 1
          fi

      - name: Enable Auth and Storage only in the isolated ephemeral source copy
        shell: bash
        run: |
          echo "Canonical source-port occupancy before CI isolation:"
          ss -ltnp | grep -E ':(54320|54321|54322)\b' || true
          docker ps --format 'table {{.Names}}\t{{.Ports}}' || true

          python3 - <<'PY'
          import socket
          from pathlib import Path

          def reserve_free_port(excluded):
              while True:
                  with socket.socket(socket.AF_INET, socket.SOCK_STREAM) as sock:
                      sock.bind(("127.0.0.1", 0))
                      port = sock.getsockname()[1]
                  if port not in excluded:
                      excluded.add(port)
                      return port

          selected = set()
          api_port = reserve_free_port(selected)
          db_port = reserve_free_port(selected)
          shadow_port = reserve_free_port(selected)

          path = Path("supabase/config.toml")
          config = path.read_text(encoding="utf-8")
          replacements = {
              "[api]\nenabled = true\nport = 54321": f"[api]\nenabled = true\nport = {api_port}",
              "[db]\nport = 54322\nshadow_port = 54320": (
                  f"[db]\nport = {db_port}\nshadow_port = {shadow_port}"
              ),
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }
          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f"Expected fail-closed repository setting not found: {old!r}")
              config = config.replace(old, new, 1)
          path.write_text(config, encoding="utf-8")
          print(
              "Ephemeral Supabase source ports: "
              f"api={api_port} db={db_port} shadow={shadow_port}"
          )
          PY

          git diff --check -- supabase/config.toml
          git diff --exit-code -- . ':(exclude)supabase/config.toml'

      - name: Run pinned DB Storage migration and rollback rehearsal
        shell: bash
        run: bash scripts/self-hosted-migration-rehearsal.sh

      - name: Verify repository copy was not polluted by rehearsal
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- . ':(exclude)supabase/config.toml'
