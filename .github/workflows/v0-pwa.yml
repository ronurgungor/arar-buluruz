name: V0 minimal PWA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v0-pwa:
    name: Manifest, installability boundary and offline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify zero-cost and narrow-scope boundary
        shell: bash
        run: |
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test ! -e yarn.lock
          test ! -e pnpm-lock.yaml
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/offline.html
          grep -q '"id": "/"' public/manifest.webmanifest
          grep -q '"purpose": "maskable"' public/manifest.webmanifest
          ! grep -Eqi 'push|background[[:space:]_-]*sync|periodicSync' public/sw.js
          ! grep -Eqi '/ara|/ilan/' public/sw.js

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Build synthetic V0
        env:
          VITE_LISTINGS_SOURCE: mock
        run: bun run build

      - name: Install Chromium with Bun-managed Playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v0-pwa-browsers
        run: bunx playwright install --with-deps chromium

      - name: Run focused V0 PWA browser validation
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v0-pwa-browsers
          VITE_LISTINGS_SOURCE: mock
        run: |
          bun run dev -- --host 127.0.0.1 --port 4174 --strictPort \
            >"$RUNNER_TEMP/v0-pwa-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4174/ >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq 60 ]]; then
              cat "$RUNNER_TEMP/v0-pwa-server.log"
              exit 1
            fi
            sleep 1
          done

          timeout 120s env BASE_URL="http://127.0.0.1:4174" bun scripts/v0-pwa-runner.ts
          find test-results/v0-pwa -maxdepth 1 -type f -name '*.png' -print -exec file {} \;

      - name: Upload V0 PWA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0-pwa-evidence
          path: |
            test-results/v0-pwa/*.png
            ${{ runner.temp }}/v0-pwa-server.log
          if-no-files-found: warn
          retention-days: 7
