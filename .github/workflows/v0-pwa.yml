name: V0 minimal PWA

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v0-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v0-pwa:
    name: Chromium manifest/service-worker readiness and offline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify zero-cost and narrow-scope boundary
        shell: bash
        run: |
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test ! -e yarn.lock
          test ! -e pnpm-lock.yaml
          test -f public/manifest.webmanifest
          test -f public/sw.js
          test -f public/offline.html
          test -f src/routes/gizlilik.tsx
          grep -q '"id": "/"' public/manifest.webmanifest
          grep -q '"purpose": "maskable"' public/manifest.webmanifest
          ! grep -Eqi 'push|background[[:space:]_-]*sync|periodicSync' public/sw.js
          ! grep -Eqi '/ara|/ilan/' public/sw.js
          ! grep -Eqi 'fonts\.(googleapis|gstatic)\.com' src/routes/__root.tsx

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Verify public V0 negative build invariants
        shell: bash
        run: |
          assert_public_build_fails() {
            local case_name="$1"
            shift
            local log_file="$RUNNER_TEMP/public-v0-${case_name}.log"

            rm -rf .output
            if env "$@" bun run build >"$log_file" 2>&1; then
              echo "Public V0 negative build unexpectedly succeeded: $case_name"
              cat "$log_file"
              exit 1
            fi

            grep -F '[Arar Buluruz build invariant]' "$log_file"
            echo "Expected public V0 build failure confirmed: $case_name"
          }

          assert_public_build_fails \
            gate1-operations \
            ARAR_BUILD_PROFILE=public-v0 \
            VITE_LISTINGS_SOURCE=mock \
            VITE_GATE1_TEST_OPERATIONS=enabled

          assert_public_build_fails \
            supabase-source \
            ARAR_BUILD_PROFILE=public-v0 \
            VITE_LISTINGS_SOURCE=supabase

          assert_public_build_fails \
            disabled-source \
            ARAR_BUILD_PROFILE=public-v0 \
            VITE_LISTINGS_SOURCE=disabled

          assert_public_build_fails \
            unknown-profile \
            ARAR_BUILD_PROFILE=unknown

      - name: Build canonical bare Lovable publish target
        shell: bash
        run: |
          unset ARAR_BUILD_PROFILE
          unset ARAR_V0_BROWSER_TEST
          unset VITE_LISTINGS_SOURCE
          unset VITE_GATE1_TEST_OPERATIONS
          unset VITE_PUBLIC_V0_RUNTIME
          unset VITE_V0_ERROR_BOUNDARY_TEST
          unset VITE_SUPABASE_URL
          unset VITE_SUPABASE_ANON_KEY
          unset VITE_SUPABASE_PUBLISHABLE_KEY
          unset NITRO_PRESET
          rm -rf .output
          bun run build

      - name: Verify canonical bare public V0 artifact
        shell: bash
        run: |
          grep -R --binary-files=without-match -F -m1 \
            'public-v0|listings=mock|gate1=off' .output
          ! grep -R --binary-files=without-match -F \
            'public-v0|listings=supabase' .output
          ! grep -R --binary-files=without-match -F \
            'public-v0|listings=disabled' .output
          ! grep -R --binary-files=without-match -F \
            'public-v0|listings=mock|gate1=on' .output

      - name: Build explicit synthetic V0 deploy target
        env:
          ARAR_BUILD_PROFILE: public-v0
          VITE_LISTINGS_SOURCE: mock
        run: |
          rm -rf .output
          bun run build

      - name: Build synthetic V0 production browser artifact
        env:
          ARAR_BUILD_PROFILE: public-v0
          ARAR_V0_BROWSER_TEST: enabled
          VITE_LISTINGS_SOURCE: mock
          VITE_V0_ERROR_BOUNDARY_TEST: enabled
          NITRO_PRESET: node-server
        run: |
          rm -rf .output
          bun run build

      - name: Install Chromium with Bun-managed Playwright
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v0-pwa-browsers
        run: bunx playwright install --with-deps chromium

      - name: Run bounded PWA hang diagnostic
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v0-pwa-browsers
          BASE_URL: http://127.0.0.1:4174
        run: timeout 90s bun scripts/v0-pwa-diagnostic.ts

      - name: Run Chromium manifest/service-worker readiness and offline validation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v0-pwa-browsers
          BASE_URL: http://127.0.0.1:4174
          DEBUG: pw:api
        run: timeout 120s bun scripts/v0-pwa-runner.ts

      - name: Run isolated Chromium mobile core-flow validation
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/v0-pwa-browsers
          BASE_URL: http://127.0.0.1:4174
        run: timeout 120s bun scripts/v0-mobile-runner.ts

      - name: Verify V0 browser evidence files
        run: find test-results/v0-pwa -maxdepth 1 -type f -name '*.png' -print -exec file {} \;

      - name: Upload V0 PWA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: v0-pwa-evidence
          path: |
            test-results/v0-pwa/*.png
            ${{ runner.temp }}/public-v0-*.log
          if-no-files-found: warn
          retention-days: 7
