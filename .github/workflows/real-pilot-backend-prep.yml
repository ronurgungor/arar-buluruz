name: Real pilot backend prep

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-pilot-backend-prep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-prep:
    name: Synthetic migration, RLS, Storage and operational-path validation
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify local-only and zero-cost boundary
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          supabase --version
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"

          if git grep -nE 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sb_secret_[A-Za-z0-9_-]{20,}' -- ':!bun.lock' ':!.github/workflows/real-pilot-backend-prep.yml'; then
            echo "Possible committed production secret material detected."
            exit 1
          fi

      - name: Enable Auth and Storage only in the ephemeral runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/config.toml")
          config = path.read_text(encoding="utf-8")

          replacements = {
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }

          for old, new in replacements.items():
              if old not in config:
                  raise SystemExit(f"Expected fail-closed repository setting not found: {old!r}")
              config = config.replace(old, new, 1)

          path.write_text(config, encoding="utf-8")
          PY

          git diff --exit-code -- . ':(exclude)supabase/config.toml'
          git diff --check -- supabase/config.toml
          grep -A4 '^\[storage\]$' supabase/config.toml

      - name: Start isolated local Supabase with Storage
        run: >-
          supabase start
          -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild database from zero migrations
        run: supabase db reset --local --no-seed

      - name: Seed configured private Storage bucket after database reset
        run: supabase seed buckets --local

      - name: Verify local migration history
        run: supabase migration list --local

      - name: Run pgTAP RLS and backend contract tests
        run: supabase test db

      - name: Run isolated trusted-photo role probes and DB health sentinel
        run: bash scripts/trusted-photo-db-role-probes.sh

      - name: Run restore-time schema and lifecycle verification
        shell: bash
        run: |
          db_container="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          if [[ -z "$db_container" ]]; then
            echo "Local Supabase Postgres container was not found."
            exit 1
          fi

          docker exec -i "$db_container" \
            psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < ops/self-hosted/restore-verification.sql

      - name: Run synthetic logical backup, clean restore and app-level verification
        run: bash scripts/self-hosted-logical-restore-drill.sh

      - name: Run synthetic REST, Storage and public signed-photo integration
        shell: bash
        run: |
          status_env="$(supabase status -o env)"

          extract_status_value() {
            local value
            value="$(printf '%s\n' "$status_env" | grep "^$1=" | head -n 1)"
            value="${value#*=}"
            value="${value#\"}"
            value="${value%\"}"
            printf '%s' "$value"
          }

          api_url="$(extract_status_value API_URL)"
          anon_key="$(extract_status_value ANON_KEY)"
          service_role_key="$(extract_status_value SERVICE_ROLE_KEY)"

          if [[ -z "$api_url" || -z "$anon_key" || -z "$service_role_key" ]]; then
            echo "Required local Supabase API_URL/ANON_KEY/SERVICE_ROLE_KEY was not available."
            exit 1
          fi

          LOCAL_SUPABASE_URL="$api_url" \
          LOCAL_SUPABASE_ANON_KEY="$anon_key" \
          LOCAL_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            bun scripts/real-pilot-backend-integration.ts

          MIGRATION_SUPABASE_URL="$api_url" \
          MIGRATION_SUPABASE_ANON_KEY="$anon_key" \
          MIGRATION_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            bun scripts/migration-photo-fixture.ts seed

      - name: Stop and remove local Supabase data
        if: always()
        run: supabase stop --no-backup

  issue72-hosted-rc-proof:
    name: "Issue #72 exact-head hosted synthetic RC proof"
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 74 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/hosted-synthetic-rc-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
      SUPABASE_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PGSSLMODE: require
      MANAGED_SUPABASE_PROJECT_REF: rzosrvenlvhijeckmwyc
      MANAGED_SUPABASE_S3_ENDPOINT: https://rzosrvenlvhijeckmwyc.storage.supabase.co/storage/v1/s3
      MANAGED_SUPABASE_S3_REGION: eu-central-1

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact-head and CI-only shim boundary
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$MANAGED_SUPABASE_PROJECT_REF" = "rzosrvenlvhijeckmwyc"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "jlbsoraqnlricbyagxdk"
          test "$MANAGED_SUPABASE_PROJECT_REF" != "gwgrwwvaiizfsqaacnhf"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          bash -n scripts/managed-supabase-migration-rehearsal.sh
          bash -n scripts/hosted-synthetic-rc-proof.sh
          bash -n scripts/pilot-rc-artifact-boundary-check.sh
          if git grep -nE 'HOSTED_RC_|hosted-rc-transport-shim|127\.0\.0\.1:54329' -- src public vite.config.ts; then
            echo "CI-only hosted transport shim marker reached runtime source."
            exit 1
          fi
          grep -Fq 'rzosrvenlvhijeckmwyc' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'jlbsoraqnlricbyagxdk' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'gwgrwwvaiizfsqaacnhf' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'hostname: "127.0.0.1"' scripts/hosted-rc-transport-shim.ts
          grep -Fq 'Browser-origin requests are forbidden.' scripts/hosted-rc-transport-shim.ts

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Compile hosted proof harness
        shell: bash
        run: |
          bun build scripts/hosted-rc-transport-shim.ts --target=bun --outfile "$RUNNER_TEMP/hosted-rc-shim.js"
          bun build scripts/hosted-pilot-operator-browser-e2e.ts --target=bun --external playwright --outfile "$RUNNER_TEMP/hosted-operator-e2e.js"
          bun build scripts/pilot-rc-artifact-e2e.ts --target=bun --external playwright --outfile "$RUNNER_TEMP/pilot-rc-artifact-e2e.js"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install PostgreSQL client and rclone
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client rclone
          test "$(bun --version)" = "1.3.14"
          test "$(supabase --version)" = "2.102.0"
          psql --version
          rclone version

      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hosted-rc-browsers
        run: bunx playwright install --with-deps chromium

      - name: Run dedicated hosted managed baseline and RC proof
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/hosted-rc-browsers
          MANAGED_SUPABASE_DB_URL: ${{ secrets.ARAR_SUPABASE_DB_URL }}
          MANAGED_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
          MANAGED_SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.ARAR_SUPABASE_S3_ACCESS_KEY_ID }}
          MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.ARAR_SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          test -n "${MANAGED_SUPABASE_DB_URL:-}"
          test -n "${MANAGED_SUPABASE_ANON_KEY:-}"
          test -n "${MANAGED_SUPABASE_S3_ACCESS_KEY_ID:-}"
          test -n "${MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY:-}"
          echo "::add-mask::$MANAGED_SUPABASE_DB_URL"
          echo "::add-mask::$MANAGED_SUPABASE_ANON_KEY"
          echo "::add-mask::$MANAGED_SUPABASE_S3_ACCESS_KEY_ID"
          echo "::add-mask::$MANAGED_SUPABASE_S3_SECRET_ACCESS_KEY"
          bash scripts/managed-supabase-migration-rehearsal.sh
          bash scripts/hosted-synthetic-rc-proof.sh
          bash scripts/pilot-rc-artifact-boundary-check.sh

      - name: Verify repository copy was not polluted
        if: always()
        shell: bash
        run: |
          git diff --check
          git diff --exit-code

      - name: Upload hosted RC browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue72-hosted-synthetic-rc-evidence
          path: test-results/hosted-rc/*.png
          if-no-files-found: warn
          retention-days: 7