name: Activation readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activation-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-activation:
    name: Synthetic self-service, privacy, 5651 and artifact boundary
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run unit contracts
        run: bun run test:unit

      - name: Verify real-data activation build still fails closed without operator identity
        shell: bash
        run: |
          set +e
          output="$(
            ARAR_BUILD_PROFILE=pilot-rc \
            ARAR_REAL_DATA_ACTIVATION=enabled \
            VITE_LISTINGS_SOURCE=supabase \
            VITE_SUPABASE_URL=https://synthetic.invalid \
            VITE_SUPABASE_ANON_KEY=synthetic-public-key \
              bun run build 2>&1
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -eq 0 ]]; then
            echo "Real-data activation build unexpectedly succeeded without operator identity."
            exit 1
          fi
          grep -F 'Real-data activation build requires VITE_OPERATOR_LEGAL_NAME.' <<<"$output"

      - name: Build synthetic self-service pilot artifact
        env:
          ARAR_BUILD_PROFILE: pilot-rc
          VITE_LISTINGS_SOURCE: supabase
          VITE_SUPABASE_URL: https://synthetic.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-public-key
        run: bun run build

      - name: Verify public artifact and source security boundary
        shell: bash
        run: |
          bash scripts/pilot-rc-artifact-boundary-check.sh

          grep -F '4 kısa adım' src/routes-pilot/ilan-ver.tsx
          grep -F 'data-testid="stage1-photo-input"' src/routes-pilot/ilan-ver.tsx
          grep -F 'phone_whatsapp' src/lib/stage1-self-service-contract.ts
          grep -F 'PILOT_SELF_SERVICE_ENABLED' src/lib/stage1-self-service-server.ts
          grep -F 'status: "pending"' src/lib/stage1-self-service-server.ts
          grep -F 'claim_listing_submission_key' src/lib/stage1-self-service-server.ts
          grep -F 'cleanupFailedSubmission' src/lib/stage1-self-service-server.ts
          grep -F 'placement="home_primary"' src/routes-pilot/index.tsx
          grep -F 'placement="search_infeed_1"' src/routes-pilot/ara.tsx
          grep -F 'placement="detail_after_description"' src/routes-pilot/ilan.\$id.tsx
          grep -F 'WhatsApp’tan yaz' src/lib/public-seller-contact.ts
          grep -F 'İlan moderasyonu' src/routes/kurucu.tsx

          if git grep -nE 'Kurucuyu ara|Telefonla başvur|seller calls founder|Hedefimiz: ilan vermek her zaman ücretsiz' -- src/routes-pilot src/build-profiles/pilot; then
            echo "Superseded founder-intake/always-free copy remains in the Stage-1 pilot UI."
            exit 1
          fi

          if git grep -nE 'PILOT_.*SERVICE_ROLE_KEY|serviceRoleKey' -- src/routes-pilot src/components src/build-profiles/pilot; then
            echo "Privileged backend credential material reached browser-facing Stage-1 source."
            exit 1
          fi

          grep -F 'revoke insert, update, delete on table public.listings from anon, authenticated;' \
            supabase/migrations/20260826181500_prepare_stage1_self_service.sql

      - name: Verify synthetic production artifact discovery remains closed
        shell: bash
        run: |
          HOST=127.0.0.1 PORT=4174 NITRO_HOST=127.0.0.1 NITRO_PORT=4174 \
            bun .output/server/index.mjs >/tmp/synthetic-pilot-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/tmp/synthetic-home.html; then
              ready=true
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/synthetic-pilot-server.log
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "true" ]]; then
            cat /tmp/synthetic-pilot-server.log
            exit 1
          fi

          curl -fsS -D /tmp/synthetic-home.headers http://127.0.0.1:4174/ -o /tmp/synthetic-home.html
          grep -Eqi '^x-robots-tag:.*noindex' /tmp/synthetic-home.headers
          grep -Eqi '<meta[^>]+name="robots"[^>]+noindex' /tmp/synthetic-home.html
          sitemap_status="$(curl -sS -o /tmp/synthetic-sitemap.txt -w '%{http_code}' http://127.0.0.1:4174/sitemap.xml)"
          test "$sitemap_status" = "404"

          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Verify repository copy remains clean
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
