name: Activation readiness

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activation-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-activation:
    name: Synthetic privacy, 5651 and activation boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify activation and 5651 contracts
        run: |
          bun test src/lib/place-provider-traffic-log.test.ts
          bun test src/build-profiles/pilot/public-discovery.test.ts

      - name: Verify real-data activation build fails closed without operator identity
        shell: bash
        run: |
          set +e
          output="$(
            ARAR_BUILD_PROFILE=pilot-rc \
            ARAR_REAL_DATA_ACTIVATION=enabled \
            VITE_LISTINGS_SOURCE=supabase \
            VITE_SUPABASE_URL=https://synthetic.invalid \
            VITE_SUPABASE_ANON_KEY=synthetic-public-key \
            VITE_PILOT_INTAKE_E164=+12025550199 \
              bun run build 2>&1
          )"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$status" -eq 0 ]]; then
            echo "Real-data activation build unexpectedly succeeded without operator identity."
            exit 1
          fi
          grep -F 'Real-data activation build requires VITE_OPERATOR_LEGAL_NAME.' <<<"$output"

      - name: Verify synthetic pilot build remains closed and does not require real identity
        env:
          ARAR_BUILD_PROFILE: pilot-rc
          VITE_LISTINGS_SOURCE: supabase
          VITE_SUPABASE_URL: https://synthetic.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-public-key
          VITE_PILOT_INTAKE_E164: "+12025550199"
        run: bun run build

      - name: Verify public pilot artifact activation boundary
        shell: bash
        run: |
          bash scripts/pilot-rc-artifact-boundary-check.sh
          test ! -e src/routes-pilot/giris.tsx
          test ! -e src/routes-pilot/kurucu.tsx
          grep -F '"/iletisim"' src/routes-pilot/index.tsx
          grep -F 'Yalnız özel kişi olarak, ara sıra ilan veren satıcılar.' src/routes-pilot/ilan-ver.tsx
          grep -F 'Bu telefon numarası bana aittir' src/routes-pilot/ilan-ver.tsx
          grep -F 'KVKK 5/2-d' src/routes-pilot/gizlilik.tsx
          grep -F 'en az bir yıllık hedef' src/routes-pilot/gizlilik.tsx
          grep -F 'Satıcıyı ara' src/routes-pilot/ilan.\$id.tsx
          if grep -R -F 'https://wa.me/' src/routes-pilot src/build-profiles/pilot .output/public; then
            echo "WhatsApp CTA leaked into activation-facing pilot graph/artifact."
            exit 1
          fi

      - name: Verify explicit public validation discovery without address or tax prerequisite
        shell: bash
        env:
          ARAR_BUILD_PROFILE: pilot-rc
          ARAR_REAL_DATA_ACTIVATION: enabled
          VITE_LISTINGS_SOURCE: supabase
          VITE_SUPABASE_URL: https://synthetic.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-public-key
          VITE_PILOT_INTAKE_E164: "+12025550199"
          VITE_OPERATOR_LEGAL_NAME: Arar Buluruz Bireysel İşletmecisi
          VITE_OPERATOR_EMAIL: iletisim@example.invalid
          VITE_OPERATOR_PHONE_E164: "+12025550199"
        run: |
          test -z "${VITE_OPERATOR_ADDRESS:-}"
          test -z "${VITE_OPERATOR_TAX_REGISTRY:-}"
          bun run build
          bunx vite preview --host 127.0.0.1 --port 4174 >/tmp/public-validation-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4174/ >/tmp/public-validation-home.html; then
              break
            fi
            sleep 1
          done
          curl -fsS -D /tmp/public-validation-home.headers http://127.0.0.1:4174/ -o /tmp/public-validation-home.html
          if grep -Eqi '^x-robots-tag:.*noindex' /tmp/public-validation-home.headers; then
            echo "Explicit public validation home remained closed by X-Robots-Tag."
            exit 1
          fi
          if grep -Eqi '<meta[^>]+name="robots"[^>]+noindex' /tmp/public-validation-home.html; then
            echo "Explicit public validation home remained closed by robots meta."
            exit 1
          fi
          curl -fsS 'http://127.0.0.1:4174/ara?q=corlu' -o /tmp/public-validation-search.html
          grep -Eqi '<meta[^>]+name="robots"[^>]+noindex' /tmp/public-validation-search.html
          sitemap_status="$(curl -sS -o /tmp/public-validation-sitemap.txt -w '%{http_code}' http://127.0.0.1:4174/sitemap.xml)"
          test "$sitemap_status" = "503"
          grep -F 'Sitemap is temporarily unavailable' /tmp/public-validation-sitemap.txt

      - name: Verify repository remains synthetic-only
        shell: bash
        run: |
          test ! -e supabase/.temp/project-ref
          git diff --exit-code
