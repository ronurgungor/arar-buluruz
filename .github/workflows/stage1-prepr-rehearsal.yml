name: Stage 1 pre-PR rehearsal

on:
  push:
    branches:
      - agent/stage1-self-service-v2

permissions:
  contents: write

concurrency:
  group: stage1-prepr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-fixes:
    name: Patch, format and rehearse Stage 1 acceptance invariants
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/stage1-self-service-v2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply bounded acceptance fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one patch marker in {path}; found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_all_exact(path: str, old: str, new: str, expected: int) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"Expected {expected} patch markers in {path}; found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/lib/stage1-self-service-server.ts",
              '''  const claim = await claimSubmission(config, keyHash, listingId);\n  if (claim.state !== "claimed") {''',
              '''  let claim: SubmissionClaim;\n  try {\n    claim = await claimSubmission(config, keyHash, listingId);\n  } catch (cause) {\n    try {\n      await cleanupFailedSubmission(config, listingId, []);\n    } catch (cleanupCause) {\n      throw new AggregateError(\n        [cause, cleanupCause],\n        "Idempotency claim failed and pending-listing cleanup was incomplete.",\n      );\n    }\n    throw cause;\n  }\n\n  if (claim.state !== "claimed") {''',
          )

          replace_once(
              "src/lib/stage1-moderation-contract.ts",
              '''  publicationInstructionRecorded: boolean;\n  photoUrls: string[];''',
              '''  publicationInstructionRecorded: boolean;\n  privateSellerDeclarationRecorded: boolean;\n  contentRightsDeclarationRecorded: boolean;\n  photoUrls: string[];''',
          )

          replace_once(
              "src/lib/stage1-moderation-server.ts",
              '''  publication_instruction_at: string | null;\n  created_at: string;''',
              '''  publication_instruction_at: string | null;\n  private_seller_declaration_at: string | null;\n  content_rights_declaration_at: string | null;\n  created_at: string;''',
          )
          replace_all_exact(
              "src/lib/stage1-moderation-server.ts",
              "contact_verified_at,publication_instruction_at,created_at",
              "contact_verified_at,publication_instruction_at,private_seller_declaration_at,content_rights_declaration_at,created_at",
              2,
          )
          replace_once(
              "src/lib/stage1-moderation-server.ts",
              '''      phoneVerified: row.contact_verified_at !== null,\n      publicationInstructionRecorded: row.publication_instruction_at !== null,\n      photoUrls,''',
              '''      phoneVerified: row.contact_verified_at !== null,\n      publicationInstructionRecorded: row.publication_instruction_at !== null,\n      privateSellerDeclarationRecorded: row.private_seller_declaration_at !== null,\n      contentRightsDeclarationRecorded: row.content_rights_declaration_at !== null,\n      photoUrls,''',
          )
          replace_once(
              "src/lib/stage1-moderation-server.ts",
              '''  if (!listing.contact_verified_at || !listing.publication_instruction_at || !listing.contact_e164 || !parseContactChannel(listing.contact_channel)) {\n    throw new ModerationError("INVALID_STATE", "Telefon kontrolü ve satıcı yayın talimatı tamamlanmamış.");\n  }\n  if ((await fetchPhotos(config, id)).length < 1)''',
              '''  if (\n    !listing.contact_verified_at ||\n    !listing.publication_instruction_at ||\n    !listing.contact_e164 ||\n    !parseContactChannel(listing.contact_channel)\n  ) {\n    throw new ModerationError(\n      "INVALID_STATE",\n      "Telefon kontrolü ve satıcı yayın talimatı tamamlanmamış.",\n    );\n  }\n  if (!listing.private_seller_declaration_at || !listing.content_rights_declaration_at) {\n    throw new ModerationError(\n      "INVALID_STATE",\n      "Gerekli satıcı ve içerik beyanı kayıtları tamamlanmamış.",\n    );\n  }\n  if ((await fetchPhotos(config, id)).length < 1)''',
          )

          replace_once(
              "src/routes/kurucu.tsx",
              '''                      <strong className="text-foreground">Telefon kontrolü:</strong> {listing.phoneVerified ? "Tamam" : "Eksik"} · <strong className="text-foreground">Yayın talimatı:</strong> {listing.publicationInstructionRecorded ? "Kayıtlı" : "Eksik"}''',
              '''                      <strong className="text-foreground">Telefon kontrolü:</strong> {listing.phoneVerified ? "Tamam" : "Eksik"} · <strong className="text-foreground">Yayın talimatı:</strong> {listing.publicationInstructionRecorded ? "Kayıtlı" : "Eksik"}<br />\n                      <strong className="text-foreground">Özel satıcı beyanı:</strong> {listing.privateSellerDeclarationRecorded ? "Kayıtlı" : "Eksik"} · <strong className="text-foreground">İçerik yetkisi:</strong> {listing.contentRightsDeclarationRecorded ? "Kayıtlı" : "Eksik"}''',
          )

          migration = Path("supabase/migrations/20260826181500_prepare_stage1_self_service.sql")
          migration_text = migration.read_text(encoding="utf-8")
          constraint = '''\nalter table public.listings\n  add constraint listings_published_stage1_declarations_ready_check\n  check (\n    status <> 'published'\n    or (\n      private_seller_declaration_at is not null\n      and content_rights_declaration_at is not null\n    )\n  );\n'''
          if "listings_published_stage1_declarations_ready_check" not in migration_text:
              marker = "\n-- Public browsers still have read-only access to active published rows only.\n"
              if marker not in migration_text:
                  raise SystemExit("Stage-1 migration insertion marker missing")
              migration.write_text(migration_text.replace(marker, constraint + marker, 1), encoding="utf-8")

          pg = Path("supabase/tests/database/stage1_self_service.test.sql")
          pg_text = pg.read_text(encoding="utf-8")
          if "publish rejects missing required seller declaration evidence" not in pg_text:
              marker = "\nselect * from finish();\n"
              block = r'''

insert into public.listings (
  id, title, description, price_amount, price_is_free, category, item_condition,
  province, district, seller_display_name, contact_channel, contact_e164,
  contact_verified_at, contact_verification_method, publication_instruction_at,
  private_seller_declaration_at, content_rights_declaration_at, status
)
values
  (
    '96000000-0000-4000-8000-000000000002',
    'Missing seller declaration fixture',
    'Synthetic pending listing missing one required Stage-1 declaration.',
    10, false, 'home', 'good', 'Tekirdağ', 'Çorlu', 'Synthetic Seller',
    'phone', '+12025550189', now() - interval '2 minutes', 'one_time_code',
    now() - interval '1 minute', null, now() - interval '1 minute', 'pending'
  ),
  (
    '96000000-0000-4000-8000-000000000003',
    'Missing content declaration fixture',
    'Synthetic pending listing missing the content-rights Stage-1 declaration.',
    10, false, 'home', 'good', 'Tekirdağ', 'Çorlu', 'Synthetic Seller',
    'whatsapp', '+12025550190', now() - interval '2 minutes', 'one_time_code',
    now() - interval '1 minute', now() - interval '1 minute', null, 'pending'
  );

select throws_like(
  $$
    update public.listings
    set status = 'published', published_at = now(), expires_at = now() + interval '1 day'
    where id = '96000000-0000-4000-8000-000000000002'
  $$,
  '%listings_published_stage1_declarations_ready_check%',
  'publish rejects missing required seller declaration evidence'
);

select throws_like(
  $$
    update public.listings
    set status = 'published', published_at = now(), expires_at = now() + interval '1 day'
    where id = '96000000-0000-4000-8000-000000000003'
  $$,
  '%listings_published_stage1_declarations_ready_check%',
  'publish rejects missing required content-rights declaration evidence'
);

set local role anon;
select is(
  (
    select count(*)::integer
    from public.get_public_listing_photos('96000000-0000-4000-8000-000000000002')
  ),
  0,
  'pending self-service photo manifest remains anonymous-invisible'
);
reset role;
'''
              if marker not in pg_text:
                  raise SystemExit("Stage-1 pgTAP insertion marker missing")
              pg.write_text(pg_text.replace(marker, block + marker, 1), encoding="utf-8")
          PY

      - name: Format bounded Stage 1 changes
        run: >-
          bunx prettier --write
          src/lib/stage1-self-service-server.ts
          src/lib/stage1-self-service-server.test.ts
          src/lib/stage1-moderation-contract.ts
          src/lib/stage1-moderation-server.ts
          src/lib/stage1-moderation-server.test.ts
          src/routes/kurucu.tsx
          supabase/migrations/20260826181500_prepare_stage1_self_service.sql
          supabase/tests/database/stage1_self_service.test.sql
          package.json

      - name: Lint and unit acceptance
        run: |
          bun run lint
          bun run test:unit
          VITE_LISTINGS_SOURCE=disabled bun run build
          git diff --check

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Enable local Auth and Storage only in runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          text = text.replace("[auth]\nenabled = false", "[auth]\nenabled = true", 1)
          text = text.replace("[storage]\nenabled = false", "[storage]\nenabled = true", 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run local migration and pgTAP rehearsal
        shell: bash
        run: |
          supabase start -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor
          trap 'supabase stop --no-backup >/dev/null 2>&1 || true' EXIT
          supabase db reset --local --no-seed
          supabase seed buckets --local
          supabase test db
          bash scripts/trusted-photo-db-role-probes.sh
          supabase stop --no-backup
          trap - EXIT
          git checkout -- supabase/config.toml
          git diff --check

      - name: Commit acceptance fixes after green rehearsal
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No acceptance-fix commit required; exact branch head already contains the fixes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/stage1-self-service-server.ts \
            src/lib/stage1-self-service-server.test.ts \
            src/lib/stage1-moderation-contract.ts \
            src/lib/stage1-moderation-server.ts \
            src/lib/stage1-moderation-server.test.ts \
            src/routes/kurucu.tsx \
            supabase/migrations/20260826181500_prepare_stage1_self_service.sql \
            supabase/tests/database/stage1_self_service.test.sql \
            package.json
          git commit -m "Fix Stage 1 acceptance invariants"
          git push origin HEAD:agent/stage1-self-service-v2
