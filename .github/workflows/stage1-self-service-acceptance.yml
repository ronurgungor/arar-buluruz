name: Stage 1 self-service acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/smsless-seller-ownership-phase1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage1-self-service-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage1-acceptance:
    name: Seller submission, moderation, RLS, Storage and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact head
        if: github.event_name == 'pull_request'
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint and unit contracts
        run: |
          bun run lint
          bun run test:unit
          git diff --check

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Verify isolated synthetic boundary
        shell: bash
        run: |
          test "$(bun --version)" = "1.3.14"
          test ! -f supabase/.temp/project-ref
          test -z "${SUPABASE_ACCESS_TOKEN:-}"
          test -z "${SUPABASE_DB_PASSWORD:-}"
          test ! -e package-lock.json
          test ! -e npm-shrinkwrap.json
          test ! -e yarn.lock
          test ! -e pnpm-lock.yaml

      - name: Enable Auth and Storage only in runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected fail-closed setting missing: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          git diff --exit-code -- . ':(exclude)supabase/config.toml'
          git diff --check -- supabase/config.toml

      - name: Start isolated local Supabase
        run: >-
          supabase start
          -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor

      - name: Rebuild migrations and seed private bucket
        run: |
          supabase db reset --local --no-seed
          supabase seed buckets --local
          supabase migration list --local

      - name: Run pgTAP, RLS and trusted-photo probes
        run: |
          supabase test db
          bash scripts/trusted-photo-db-role-probes.sh

      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/stage1-browsers
        run: bunx playwright install --with-deps chromium

      - name: Build production-like public pilot artifact
        shell: bash
        run: |
          status_env="$(supabase status -o env)"
          extract_status_value() {
            local value
            value="$(printf '%s\n' "$status_env" | grep "^$1=" | head -n 1)"
            value="${value#*=}"
            value="${value#\"}"
            value="${value%\"}"
            printf '%s' "$value"
          }
          api_url="$(extract_status_value API_URL)"
          anon_key="$(extract_status_value ANON_KEY)"
          test -n "$api_url"
          test -n "$anon_key"

          ARAR_BUILD_PROFILE=pilot-rc \
          NITRO_PRESET=node-server \
          VITE_LISTINGS_SOURCE=supabase \
          VITE_SUPABASE_URL="$api_url" \
          VITE_SUPABASE_ANON_KEY="$anon_key" \
            bun run build

          bash scripts/pilot-rc-artifact-boundary-check.sh

      - name: Run canonical Stage 1 browser journey
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/stage1-browsers
        run: |
          status_env="$(supabase status -o env)"
          extract_status_value() {
            local value
            value="$(printf '%s\n' "$status_env" | grep "^$1=" | head -n 1)"
            value="${value#*=}"
            value="${value#\"}"
            value="${value%\"}"
            printf '%s' "$value"
          }
          api_url="$(extract_status_value API_URL)"
          anon_key="$(extract_status_value ANON_KEY)"
          service_role_key="$(extract_status_value SERVICE_ROLE_KEY)"
          test -n "$api_url"
          test -n "$anon_key"
          test -n "$service_role_key"
          echo "::add-mask::$service_role_key"

          HOST=127.0.0.1 \
          PORT=4173 \
          NITRO_HOST=127.0.0.1 \
          NITRO_PORT=4173 \
          PILOT_SELF_SERVICE_ENABLED=enabled \
          PILOT_SUBMISSION_SUPABASE_URL="$api_url" \
          PILOT_SUBMISSION_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
          PILOT_SUBMISSION_CAPABILITY_SECRET="synthetic-stage1-capability-secret-0123456789" \
            bun .output/server/index.mjs >"$RUNNER_TEMP/stage1-public.log" 2>&1 &
          public_pid=$!

          VITE_LISTINGS_SOURCE=supabase \
          VITE_SUPABASE_URL="$api_url" \
          VITE_SUPABASE_ANON_KEY="$anon_key" \
          VITE_PILOT_OPERATOR_UI=enabled \
          PILOT_OPERATOR_ENABLED=enabled \
          PILOT_OPERATOR_SUPABASE_URL="$api_url" \
          PILOT_OPERATOR_SUPABASE_SERVICE_ROLE_KEY="$service_role_key" \
            bun --bun vite dev --host 127.0.0.1 --port 4175 --strictPort \
              >"$RUNNER_TEMP/stage1-founder.log" 2>&1 &
          founder_pid=$!

          cleanup() {
            kill "$public_pid" "$founder_pid" 2>/dev/null || true
            wait "$public_pid" 2>/dev/null || true
            wait "$founder_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for url in http://127.0.0.1:4173/ilan-ver http://127.0.0.1:4175/kurucu; do
            ready=false
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                ready=true
                break
              fi
              sleep 1
            done
            if [[ "$ready" != "true" ]]; then
              cat "$RUNNER_TEMP/stage1-public.log" || true
              cat "$RUNNER_TEMP/stage1-founder.log" || true
              exit 1
            fi
          done

          PUBLIC_BASE_URL=http://127.0.0.1:4173 \
          FOUNDER_BASE_URL=http://127.0.0.1:4175 \
          BACKEND_ORIGIN="$api_url" \
          BACKEND_ANON_KEY="$anon_key" \
          BACKEND_SERVICE_ROLE_KEY="$service_role_key" \
            bun scripts/stage1-self-service-browser-e2e.ts

          cleanup
          trap - EXIT

      - name: Verify public artifact contains no service-role key and assets are present
        shell: bash
        run: |
          status_env="$(supabase status -o env)"
          service_role_key="$(printf '%s\n' "$status_env" | grep '^SERVICE_ROLE_KEY=' | head -n 1)"
          service_role_key="${service_role_key#*=}"
          service_role_key="${service_role_key#\"}"
          service_role_key="${service_role_key%\"}"
          test -n "$service_role_key"
          if grep -R --binary-files=without-match -F "$service_role_key" .output test-results/stage1-self-service 2>/dev/null; then
            echo "Service-role credential leaked into public artifact/evidence."
            exit 1
          fi
          test -n "$(find .output/public/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          test -n "$(find .output/public/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          git diff --check

      - name: Upload Stage 1 browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stage1-self-service-browser-evidence
          path: |
            test-results/stage1-self-service/*.png
            ${{ runner.temp }}/stage1-public.log
            ${{ runner.temp }}/stage1-founder.log
          if-no-files-found: warn
          retention-days: 7

      - name: Restore repository config and verify cleanliness
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          git checkout -- supabase/config.toml 2>/dev/null || true
          git diff --check
          git diff --exit-code
