name: Pilot route format once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: >-
      github.event.pull_request.number == 74 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/hosted-synthetic-rc-proof'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/hosted-synthetic-rc-proof
          persist-credentials: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Format only the isolation implementation
        run: >-
          bunx prettier --write
          src/build-profiles/pilot/PilotTopBar.tsx
          src/build-profiles/pilot/public-listings.ts
          src/router.pilot.tsx
          src/routes-pilot
          src/server.pilot.ts
          src/lib/product-phase.ts
          vite.config.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build-profiles/pilot src/router.pilot.tsx src/routes-pilot src/server.pilot.ts src/lib/product-phase.ts vite.config.ts
          git commit -m "Format pilot route isolation"
          git push origin HEAD:agent/hosted-synthetic-rc-proof
