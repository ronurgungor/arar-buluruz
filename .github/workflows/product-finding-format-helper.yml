name: Product Finding formatter helper

on:
  push:
    branches:
      - agent/product-finding-integrity-phase1

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format Phase 1 TypeScript and package contract
        run: >-
          bunx prettier --write
          package.json
          src/lib/listing-search.ts
          src/lib/product-finding-contract.test.ts
          src/lib/product-finding-contract.ts
          src/lib/public-listings-contact.test.ts
          src/lib/public-listings-supabase.ts
          src/lib/public-listings.test.ts
          src/lib/public-listings.ts
          src/lib/stage1-product-fields.ts
          src/lib/stage1-product-integrity-server.test.ts
          src/lib/stage1-self-service-server.ts
          src/lib/stage1-seller-management-contract.ts
      - name: Remove temporary formatter workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/product-finding-format-helper.yml
          git add package.json src/lib .github/workflows/product-finding-format-helper.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Format Product Finding Phase 1'
          git push origin HEAD:agent/product-finding-integrity-phase1
