name: Product Finding preflight adjustment helper

on:
  push:
    branches:
      - agent/product-finding-integrity-phase1

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Restrict Prettier check to Phase 1 changed code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/product-finding-phase1-preflight.yml')
          text = path.read_text(encoding='utf-8')
          old = '        run: bunx prettier --check .\n'
          new = '''        run: >-\n          bunx prettier --check\n          package.json\n          src/lib/listing-search.ts\n          src/lib/product-finding-contract.test.ts\n          src/lib/product-finding-contract.ts\n          src/lib/public-listings-contact.test.ts\n          src/lib/public-listings-supabase.ts\n          src/lib/public-listings.test.ts\n          src/lib/public-listings.ts\n          src/lib/stage1-product-fields.ts\n          src/lib/stage1-product-integrity-server.test.ts\n          src/lib/stage1-self-service-server.ts\n          src/lib/stage1-seller-management-contract.ts\n'''
          if old not in text:
              raise SystemExit('Expected global Prettier command not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/product-finding-preflight-adjust-helper.yml
          git add .github/workflows/product-finding-phase1-preflight.yml .github/workflows/product-finding-preflight-adjust-helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restrict Product Finding preflight formatting scope'
          git push origin HEAD:agent/product-finding-integrity-phase1
