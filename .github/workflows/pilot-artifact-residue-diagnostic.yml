name: Pilot artifact residue diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pilot-artifact-residue-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.pull_request.number == 74 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/hosted-synthetic-rc-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build pilot artifact with source maps
        env:
          ARAR_BUILD_PROFILE: pilot-rc
          VITE_LISTINGS_SOURCE: supabase
          VITE_SUPABASE_URL: https://rzosrvenlvhijeckmwyc.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ARAR_SUPABASE_PUBLIC_KEY }}
          VITE_PILOT_INTAKE_E164: +12025550199
          NITRO_PRESET: node-server
        run: bun --bun vite build --sourcemap

      - name: Locate exact forbidden literal and trace chunk sources
        shell: bash
        run: |
          set -euo pipefail
          marker='V0 test sürümü'
          matches="$(grep -RIl --binary-files=without-match -F "$marker" .output/public || true)"
          if [[ -z "$matches" ]]; then
            echo "Marker not found in diagnostic build." >&2
            exit 1
          fi
          printf 'FORBIDDEN_LITERAL_FILES_BEGIN\n%s\nFORBIDDEN_LITERAL_FILES_END\n' "$matches"
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            echo "--- marker context: $file ---"
            grep -n -F -C 1 "$marker" "$file" || true
            map="${file}.map"
            if [[ -f "$map" ]]; then
              echo "--- source-map sources containing likely V0/root modules: $map ---"
              python3 - "$map" <<'PY'
import json, sys
from pathlib import Path
m = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
for i, source in enumerate(m.get('sources', [])):
    if any(token in source for token in ('routes/__root', 'data/listings', 'public-listings', 'product-phase', 'routes/giris', 'routes/sikayet', 'routes/ilan-ver')):
        print(i, source)
PY
            fi
          done <<< "$matches"

          echo '--- emitted V0 mock image assets ---'
          find .output/public/assets -maxdepth 1 -type f -name 'ilan-*.jpg' -print | sort || true

          echo '--- source modules containing exact literal in checked-out source ---'
          grep -RIn --binary-files=without-match -F "$marker" src || true

          # Diagnostic remains fail-closed: residue is expected at this stage and is never accepted.
          exit 1
