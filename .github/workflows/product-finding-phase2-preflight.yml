name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Patch exact-anchor hit-target readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Patch buyer harness and push once
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          buyer = Path("scripts/stage1-self-service-browser-e2e-buyer.ts")
          text = buyer.read_text()
          old = '''  await exactAnchor.scrollIntoViewIfNeeded();

  const point = await exactAnchor.evaluate((node, href) => {'''
          new = '''  await exactAnchor.scrollIntoViewIfNeeded();
  await page.waitForFunction(
    (href) => {
      const node = [...document.querySelectorAll<HTMLAnchorElement>("a[href]")].find(
        (anchor) => anchor.getAttribute("href") === href,
      );
      if (!node) return false;
      const rect = node.getBoundingClientRect();
      const left = Math.max(0, rect.left);
      const right = Math.min(window.innerWidth, rect.right);
      const top = Math.max(0, rect.top);
      const bottom = Math.min(window.innerHeight, rect.bottom);
      if (right <= left || bottom <= top) return false;
      const firstX = Math.ceil(left) + 1;
      const lastX = Math.floor(right) - 1;
      const firstY = Math.ceil(top) + 1;
      const lastY = Math.floor(bottom) - 1;
      for (let y = firstY; y <= lastY; y += 8) {
        for (let x = firstX; x <= lastX; x += 8) {
          const hit = document.elementFromPoint(x, y);
          if (hit instanceof Element && hit.closest("a") === node) return true;
        }
      }
      return false;
    },
    expectedHref,
    { timeout: 2000 },
  );

  const point = await exactAnchor.evaluate((node, href) => {'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one exact-anchor readiness patch point, found {text.count(old)}")
          buyer.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage1-self-service-browser-e2e-buyer.ts
          if git diff --cached --quiet; then
            echo "Hit-target readiness patch already present."
            exit 0
          fi
          git commit -m "Wait for real result hit target before detail click"
          git push origin HEAD:agent/product-finding-phase2
