name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Phase 2 detail-navigation discriminator and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install durable exact-anchor hit-test discriminator once
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          buyer = Path("scripts/stage1-self-service-browser-e2e-buyer.ts")
          text = buyer.read_text()
          marker = "async function findExactResultAnchorHitPoint"
          if marker not in text:
              helper = base64.b64decode("").decode()
              old = base64.b64decode("").decode()
              new = base64.b64decode("").decode()
              insertion = "\ntry {\n"
              if text.count(insertion) != 1 or text.count(old) != 1:
                  raise SystemExit("Detail discriminator patch anchors changed; refusing blind mutation")
              text = text.replace(insertion, "\n" + helper + insertion, 1).replace(old, new, 1)
              buyer.write_text(text)
          PY

          if git diff --quiet -- scripts/stage1-self-service-browser-e2e-buyer.ts; then
            echo "Durable exact-anchor discriminator is already installed."
          else
            bunx prettier --write scripts/stage1-self-service-browser-e2e-buyer.ts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/stage1-self-service-browser-e2e-buyer.ts
            git commit -m "Use verified real hit target for detail navigation"
            git push origin HEAD:agent/product-finding-phase2
          fi

      - name: Check canonical formatting
        run: bunx prettier --check scripts/stage1-self-service-browser-e2e-buyer.ts

      - name: Lint
        run: bun run lint

      - name: Full unit suite
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

      - name: Verify CI did not mutate tracked source
        run: git diff --check && git diff --exit-code
