name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Phase 2 harness patch, formatting, lint, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Apply stable Product Finding trigger harness contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sheet = Path("src/components/search/ProductFindingFilterSheet.tsx")
          text = sheet.read_text()
          old = '          type="button"\n          className="inline-flex h-11 shrink-0 items-center gap-2 rounded-full border border-border bg-card px-4 text-sm font-semibold shadow-sm transition-colors hover:bg-accent"'
          new = '          type="button"\n          data-testid="product-finding-filter-trigger"\n          className="inline-flex h-11 shrink-0 items-center gap-2 rounded-full border border-border bg-card px-4 text-sm font-semibold shadow-sm transition-colors hover:bg-accent"'
          if 'data-testid="product-finding-filter-trigger"' not in text:
              if old not in text:
                  raise SystemExit("Product Finding trigger shape changed; refusing blind patch")
              text = text.replace(old, new, 1)
              sheet.write_text(text)

          buyer = Path("scripts/stage1-self-service-browser-e2e-buyer.ts")
          text = buyer.read_text()
          proof_anchor = '  assert(\n    JSON.stringify(strictContextual.km) === JSON.stringify({ min: null, max: 100000 }),\n    "Zero-result range was not retained as a hard canonical filter.",\n  );\n\n  await page.getByRole("button", { name: /^Filtreler/ }).click();\n  await enterKmByUserInteraction("120000");'
          proof_replacement = '  assert(\n    JSON.stringify(strictContextual.km) === JSON.stringify({ min: null, max: 100000 }),\n    "Zero-result range was not retained as a hard canonical filter.",\n  );\n\n  await page.getByRole("button", { name: "Filtreleri temizle", exact: true }).waitFor();\n  const hardFilterUrlBeforeReopen = page.url();\n  const filterTrigger = page.getByTestId("product-finding-filter-trigger");\n  assert(\n    (await filterTrigger.count()) === 1,\n    "Product Finding filter trigger must exist exactly once in the zero-result state.",\n  );\n  await filterTrigger.click();\n  assert(\n    page.url() === hardFilterUrlBeforeReopen,\n    "Opening the Product Finding Drawer changed the canonical hard-filter URL.",\n  );\n  await page.getByLabel("Kilometre maksimum", { exact: true }).waitFor();\n  assert(\n    page.url() === hardFilterUrlBeforeReopen,\n    "The hard-filter URL changed while opening the Product Finding Drawer.",\n  );\n  await enterKmByUserInteraction("120000");'
          if proof_anchor in text:
              text = text.replace(proof_anchor, proof_replacement, 1)
          elif "hardFilterUrlBeforeReopen" not in text:
              raise SystemExit("Zero-result reopen block changed; refusing blind patch")

          ambiguous = 'page.getByRole("button", { name: /^Filtreler/ })'
          text = text.replace(ambiguous, 'page.getByTestId("product-finding-filter-trigger")')
          if ambiguous in text:
              raise SystemExit("Ambiguous filter trigger selector remains")
          buyer.write_text(text)
          PY

          bunx prettier --write src/components/search/ProductFindingFilterSheet.tsx scripts/stage1-self-service-browser-e2e-buyer.ts

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/components/search/ProductFindingFilterSheet.tsx scripts/stage1-self-service-browser-e2e-buyer.ts
            git commit -m "Fix Product Finding filter trigger harness collision"
            git push origin HEAD:agent/product-finding-phase2
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check canonical formatting
        shell: bash
        run: |
          bunx prettier --check \
            docs/PRODUCT_FINDING_PHASE2_CONTRACT.md \
            src/components/product/ProductSelectionFields.tsx \
            src/components/search/ProductFindingFilterSheet.tsx \
            src/lib/product-finding-buyer-facets.ts \
            src/lib/product-finding-contract.ts \
            src/lib/product-finding-contract.test.ts \
            src/lib/product-finding-range-filters.test.ts \
            src/lib/product-finding-search-url.ts \
            src/lib/product-finding-search-url.test.ts \
            src/lib/product-finding-ui-contract.ts \
            src/lib/product-finding-ui-contract.test.ts \
            src/lib/listing-search.ts \
            src/lib/listing-search.test.ts \
            src/lib/listing-return.ts \
            src/lib/stage1-product-fields.ts \
            src/routes-pilot/ara.tsx \
            src/routes-pilot/ilan-ver.tsx \
            src/routes-pilot/ilanlarim.tsx \
            'src/routes-pilot/ilan.$id.tsx' \
            scripts/stage1-self-service-browser-e2e.ts \
            scripts/stage1-self-service-browser-e2e-shared.ts \
            scripts/stage1-self-service-browser-e2e-seller-create.ts \
            scripts/stage1-self-service-browser-e2e-buyer.ts \
            scripts/stage1-self-service-browser-e2e-seller-management.ts \
            package.json

      - name: Lint
        run: bun run lint

      - name: Full unit suite
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

      - name: Verify CI did not mutate tracked source
        run: git diff --exit-code
