name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format Phase 2 buyer harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format and commit buyer harness if needed
        shell: bash
        run: |
          bunx prettier --write scripts/stage1-self-service-browser-e2e-buyer.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/stage1-self-service-browser-e2e-buyer.ts
            git commit -m "Format Phase 2 Back scroll proof"
            git push origin HEAD:agent/product-finding-phase2
          fi
          bunx prettier --check scripts/stage1-self-service-browser-e2e-buyer.ts
