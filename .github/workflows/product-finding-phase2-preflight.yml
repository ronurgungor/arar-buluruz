name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Stabilize exact result hit target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Replace helper with stable-frame hit-test and push once
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          buyer = Path("scripts/stage1-self-service-browser-e2e-buyer.ts")
          text = buyer.read_text()
          start_marker = "async function findExactResultAnchorHitPoint(expectedHref: string) {"
          end_marker = "\n\ntry {\n"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          helper = base64.b64decode("").decode()
          text = text[:start] + helper.rstrip() + text[end:]
          buyer.write_text(text)
          PY
          bunx prettier --write scripts/stage1-self-service-browser-e2e-buyer.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage1-self-service-browser-e2e-buyer.ts
          if git diff --cached --quiet; then
            echo "Stable-frame helper already present."
            exit 0
          fi
          git commit -m "Require stable real detail hit target"
          git push origin HEAD:agent/product-finding-phase2
