name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2

permissions:
  contents: write

jobs:
  format-harness:
    if: github.event.head_commit.message == 'Trigger canonical harness prettier'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/product-finding-phase2
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format only canonical browser harness
        run: |
          bunx prettier --write scripts/stage1-self-service-browser-e2e.ts
          bunx prettier --check scripts/stage1-self-service-browser-e2e.ts
          git diff --check

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage1-self-service-browser-e2e.ts
          git commit -m "Format canonical browser harness"
          git push origin HEAD:agent/product-finding-phase2
