name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Phase 2 temporary formatter and quality probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format split harness in runner copy
        run: |
          bunx prettier --write \
            scripts/stage1-self-service-browser-e2e.ts \
            scripts/stage1-self-service-browser-e2e-shared.ts \
            scripts/stage1-self-service-browser-e2e-seller-create.ts \
            scripts/stage1-self-service-browser-e2e-buyer.ts \
            scripts/stage1-self-service-browser-e2e-seller-management.ts

      - name: Commit formatting-only harness delta if needed
        shell: bash
        run: |
          if ! git diff --quiet -- \
            scripts/stage1-self-service-browser-e2e.ts \
            scripts/stage1-self-service-browser-e2e-shared.ts \
            scripts/stage1-self-service-browser-e2e-seller-create.ts \
            scripts/stage1-self-service-browser-e2e-buyer.ts \
            scripts/stage1-self-service-browser-e2e-seller-management.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              scripts/stage1-self-service-browser-e2e.ts \
              scripts/stage1-self-service-browser-e2e-shared.ts \
              scripts/stage1-self-service-browser-e2e-seller-create.ts \
              scripts/stage1-self-service-browser-e2e-buyer.ts \
              scripts/stage1-self-service-browser-e2e-seller-management.ts
            git commit -m "Format split Phase 2 browser harness"
            git push origin HEAD:agent/product-finding-phase2
            echo "Formatting commit pushed; this run stops before semantic gates."
            exit 78
          fi

      - name: Lint formatted runner copy
        run: bun run lint

      - name: Full unit suite
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

      - name: Verify runner copy stayed clean
        run: git diff --exit-code
