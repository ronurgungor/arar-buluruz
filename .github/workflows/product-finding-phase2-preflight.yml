name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    name: Patch exact-anchor hit-target readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Patch buyer harness and push once
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          buyer = Path("scripts/stage1-self-service-browser-e2e-buyer.ts")
          text = buyer.read_text()
          old = base64.b64decode("ICBhd2FpdCBleGFjdEFuY2hvci5zY3JvbGxJbnRvVmlld0lmTmVlZGVkKCk7CiAgY29uc3QgcG9pbnQgPSBhd2FpdCBleGFjdEFuY2hvci5ldmFsdWF0ZSgobm9kZSwgaHJlZikgPT4gew==").decode()
          new = base64.b64decode("").decode()
          if text.count(old) != 1:
              raise SystemExit(f"Expected one exact-anchor readiness patch point, found {text.count(old)}")
          buyer.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage1-self-service-browser-e2e-buyer.ts
          if git diff --cached --quiet; then
            echo "Hit-target readiness patch already present."
            exit 0
          fi
          git commit -m "Wait for real result hit target before detail click"
          git push origin HEAD:agent/product-finding-phase2
