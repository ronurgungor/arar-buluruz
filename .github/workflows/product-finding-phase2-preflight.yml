name: Product Finding Phase 2 preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Phase 2 contract lint, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check Phase 2 formatting
        run: bunx prettier --check docs/PRODUCT_FINDING_PHASE2_CONTRACT.md src/lib/product-finding-buyer-facets.ts src/lib/product-finding-contract.ts src/lib/product-finding-contract.test.ts src/lib/product-finding-ui-contract.ts src/lib/product-finding-ui-contract.test.ts src/lib/listing-search.ts src/lib/listing-search.test.ts package.json

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build
