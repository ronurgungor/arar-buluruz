name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Phase 2 contract lint, unit and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Format Phase 2 files in runner
        run: bunx prettier --write docs/PRODUCT_FINDING_PHASE2_CONTRACT.md src/lib/product-finding-ui-contract.ts src/lib/product-finding-ui-contract.test.ts src/lib/listing-search.ts src/lib/listing-search.test.ts package.json

      - name: Verify formatted diff is clean
        run: git diff --check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

      - name: Upload runner-formatted Phase 2 files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: product-finding-phase2-formatted
          path: |
            docs/PRODUCT_FINDING_PHASE2_CONTRACT.md
            src/lib/product-finding-ui-contract.ts
            src/lib/product-finding-ui-contract.test.ts
            src/lib/listing-search.ts
            src/lib/listing-search.test.ts
            package.json
          retention-days: 1
