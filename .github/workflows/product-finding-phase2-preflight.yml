name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2

permissions:
  contents: write

jobs:
  patch-formatting:
    if: github.event.head_commit.message == 'Trigger harness formatting patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/product-finding-phase2
          fetch-depth: 0

      - name: Fix exact harness indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/stage1-self-service-browser-e2e.ts")
          text = path.read_text(encoding="utf-8")
          old = "  await compatibilityPage.close();\nawait compatibilityContext.close();\n"
          new = "  await compatibilityPage.close();\n  await compatibilityContext.close();\n"
          if text.count(old) != 1:
              raise SystemExit(f"Expected indentation target once, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage1-self-service-browser-e2e.ts
          git commit -m "Format late buyer harness isolation"
          git push origin HEAD:agent/product-finding-phase2
