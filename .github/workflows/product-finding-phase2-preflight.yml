name: Product Finding Phase 2 preflight

on:
  push:
    branches:
      - agent/product-finding-phase2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: product-finding-phase2-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Phase 2 Back interaction patch and quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Patch Back scroll proof to preserve the actual visible click position
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          buyer = Path("scripts/stage1-self-service-browser-e2e-buyer.ts")
          text = buyer.read_text()
          old = """  await page.setViewportSize({ width: 390, height: 420 });
          await restoredResult.scrollIntoViewIfNeeded();
          const resultsScrollY = await page.evaluate(() => window.scrollY);
          assert(resultsScrollY > 0, \"Search fixture was not scrollable for Back restoration proof.\");
          const searchUrlBeforeDetail = page.url();
          await restoredResult.click();"""
          new = """  await page.setViewportSize({ width: 390, height: 420 });
          await restoredResult.scrollIntoViewIfNeeded();
          const resultBox = await restoredResult.boundingBox();
          assert(
            resultBox !== null,
            \"Search result had no visible click geometry for Back restoration proof.\",
          );
          const resultsScrollY = await page.evaluate(() => window.scrollY);
          assert(resultsScrollY > 0, \"Search fixture was not scrollable for Back restoration proof.\");
          const searchUrlBeforeDetail = page.url();
          await page.mouse.click(
            resultBox.x + resultBox.width / 2,
            resultBox.y + resultBox.height / 2,
          );"""
          if old not in text:
              raise SystemExit("Back scroll proof block changed; refusing blind patch")
          buyer.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/stage1-self-service-browser-e2e-buyer.ts
          git commit -m "Use visible mouse click in Back scroll proof"
          git push origin HEAD:agent/product-finding-phase2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bunx prettier --check scripts/stage1-self-service-browser-e2e-buyer.ts

      - name: Lint
        run: bun run lint

      - name: Full unit suite
        run: bun run test:unit

      - name: Build with backend connection disabled
        env:
          VITE_LISTINGS_SOURCE: disabled
        run: bun run build

      - name: Verify CI did not mutate tracked source
        run: git diff --check && git diff --exit-code
