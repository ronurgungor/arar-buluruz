name: Stage 1 Phase A code gate

"on":
  push:
    branches:
      - agent/stage1-self-service-v2

permissions:
  contents: write

jobs:
  phase-a:
    name: Stage 1 executable code invariants
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out exact event head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply deterministic remaining Phase A invariants
        run: |
          python3 scripts/stage1-phase-a-fix.py
          python3 scripts/stage1-phase-a-ts-fix.py

      - name: Format focused Phase A code
        run: >-
          bunx prettier --write
          src/lib/stage1-self-service-contract.test.ts
          src/lib/stage1-self-service-server.ts
          src/lib/stage1-self-service-server.test.ts
          src/lib/stage1-moderation-server.ts
          src/lib/stage1-moderation-server.test.ts
          src/lib/public-seller-contact.ts
          src/lib/public-seller-contact.test.ts
          src/lib/listing-photo.ts
          src/lib/listing-photo.test.ts
          src/lib/listing-photo-trusted.ts
          src/lib/listing-photo-trusted.test.ts

      - name: Focused Stage 1 unit and trusted-photo tests
        run: >-
          bun test
          src/lib/stage1-self-service-contract.test.ts
          src/lib/stage1-self-service-server.test.ts
          src/lib/stage1-moderation-server.test.ts
          src/lib/public-seller-contact.test.ts
          src/lib/listing-photo.test.ts
          src/lib/listing-photo-trusted.test.ts

      - name: Focused Stage 1 production TypeScript check
        shell: bash
        run: |
          trap 'rm -f tsconfig.stage1-phase-a.json' EXIT
          cat > tsconfig.stage1-phase-a.json <<'JSON'
          {
            "extends": "./tsconfig.json",
            "include": [
              "src/lib/stage1-self-service-contract.ts",
              "src/lib/stage1-self-service-server.ts",
              "src/lib/stage1-moderation-server.ts",
              "src/lib/public-seller-contact.ts",
              "src/lib/listing-photo.ts",
              "src/lib/listing-photo-trusted.ts"
            ]
          }
          JSON
          bunx tsc -p tsconfig.stage1-phase-a.json --pretty false

      - name: Lint focused Phase A code
        run: >-
          bunx eslint
          src/lib/stage1-self-service-contract.test.ts
          src/lib/stage1-self-service-server.ts
          src/lib/stage1-self-service-server.test.ts
          src/lib/stage1-moderation-server.ts
          src/lib/stage1-moderation-server.test.ts
          src/lib/public-seller-contact.ts
          src/lib/public-seller-contact.test.ts
          src/lib/listing-photo.ts
          src/lib/listing-photo.test.ts
          src/lib/listing-photo-trusted.ts
          src/lib/listing-photo-trusted.test.ts

      - name: Build production-like pilot artifact
        env:
          ARAR_BUILD_PROFILE: pilot-rc
          NITRO_PRESET: node-server
          VITE_LISTINGS_SOURCE: supabase
          VITE_SUPABASE_URL: https://synthetic.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-public-key
        run: bun run build

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Enable Auth and Storage only in ephemeral runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected fail-closed Supabase config marker not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Start local Supabase and run relevant pgTAP suite
        shell: bash
        run: |
          supabase start -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
          supabase seed buckets --local
          supabase test db

      - name: Stop local Supabase and restore committed config
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup || true
          git checkout -- supabase/config.toml || true

      - name: Diff hygiene
        shell: bash
        run: |
          git fetch origin main --no-tags
          git diff --check
          git diff --check origin/main...HEAD

      - name: Commit Phase A fixes only after executable gate passes
        shell: bash
        run: |
          git checkout -- supabase/config.toml
          if git diff --quiet; then
            echo "Phase A implementation already present; exact head required no mutation."
            exit 0
          fi

          remote_head="$(git ls-remote origin refs/heads/agent/stage1-self-service-v2 | cut -f1)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "Ref moved during Phase A execution: expected $GITHUB_SHA, found $remote_head" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/stage1-self-service-contract.test.ts \
            src/lib/stage1-self-service-server.ts \
            src/lib/stage1-self-service-server.test.ts \
            src/lib/stage1-moderation-server.ts \
            src/lib/stage1-moderation-server.test.ts \
            src/lib/public-seller-contact.ts \
            src/lib/public-seller-contact.test.ts \
            src/lib/listing-photo.ts \
            src/lib/listing-photo.test.ts \
            src/lib/listing-photo-trusted.ts \
            src/lib/listing-photo-trusted.test.ts \
            supabase/migrations/20260826181500_prepare_stage1_self_service.sql \
            supabase/tests/database/stage1_self_service.test.sql
          git diff --cached --check
          git commit -m "Enforce Stage 1 publish readiness"
          git push origin HEAD:agent/stage1-self-service-v2
