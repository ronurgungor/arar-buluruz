name: Stage 1 Phase A code gate

on:
  push:
    branches:
      - agent/stage1-self-service-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: stage1-phase-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-a:
    if: >-
      (github.event_name == 'push' && github.ref_name == 'agent/stage1-self-service-v2') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/stage1-self-service-v2')
    name: Stage 1 executable code invariants
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out Stage 1 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/stage1-self-service-v2
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check focused Phase A formatting
        run: >-
          bunx prettier --check
          .github/workflows/stage1-known-fix-closure.yml
          package.json
          tsconfig.json
          tsconfig.pilot.json
          src/lib/stage1-self-service-contract.test.ts
          src/lib/stage1-self-service-server.ts
          src/lib/stage1-self-service-server.test.ts
          src/lib/stage1-moderation-server.ts
          src/lib/stage1-moderation-server.test.ts
          src/lib/public-seller-contact.ts
          src/lib/public-seller-contact.test.ts
          src/lib/listing-photo.ts
          src/lib/listing-photo.test.ts
          src/lib/listing-photo-trusted.ts
          src/lib/listing-photo-trusted.test.ts
          src/data/turkiye-locations.ts
          src/lib/external-sales-link.test.ts
          src/lib/pilot-operator-server.ts
          src/lib/public-listings-contact.test.ts
          src/lib/public-listings.test.ts
          src/routes-pilot/ara.tsx

      - name: Unit contracts
        run: bun run test:unit

      - name: Repository TypeScript check
        run: bunx tsc --noEmit --pretty false

      - name: Lint focused Phase A code
        run: >-
          bunx eslint
          src/lib/stage1-self-service-contract.test.ts
          src/lib/stage1-self-service-server.ts
          src/lib/stage1-self-service-server.test.ts
          src/lib/stage1-moderation-server.ts
          src/lib/stage1-moderation-server.test.ts
          src/lib/public-seller-contact.ts
          src/lib/public-seller-contact.test.ts
          src/lib/listing-photo.ts
          src/lib/listing-photo.test.ts
          src/lib/listing-photo-trusted.ts
          src/lib/listing-photo-trusted.test.ts
          src/data/turkiye-locations.ts
          src/lib/external-sales-link.test.ts
          src/lib/pilot-operator-server.ts
          src/lib/public-listings-contact.test.ts
          src/lib/public-listings.test.ts
          src/routes-pilot/ara.tsx

      - name: Build production-like pilot artifact
        env:
          ARAR_BUILD_PROFILE: pilot-rc
          NITRO_PRESET: node-server
          VITE_LISTINGS_SOURCE: supabase
          VITE_SUPABASE_URL: https://synthetic.invalid
          VITE_SUPABASE_ANON_KEY: synthetic-public-key
        run: bun run build

      - name: Pilot TypeScript check after route generation
        run: bunx tsc --project tsconfig.pilot.json --noEmit --pretty false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.102.0

      - name: Restore canonical Bun after Supabase setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Enable Auth and Storage only in ephemeral runner copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("supabase/config.toml")
          text = path.read_text(encoding="utf-8")
          for old, new in {
              "[auth]\nenabled = false": "[auth]\nenabled = true",
              "[storage]\nenabled = false": "[storage]\nenabled = true",
          }.items():
              if old not in text:
                  raise SystemExit(f"Expected fail-closed Supabase config marker not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Start local Supabase and run relevant pgTAP suite
        shell: bash
        run: |
          supabase start -x realtime,imgproxy,studio,mailpit,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
          supabase seed buckets --local
          supabase test db

      - name: Stop local Supabase and restore committed config
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup || true
          git checkout -- supabase/config.toml || true

      - name: Diff hygiene
        shell: bash
        run: |
          git diff --check
          git diff --check origin/main...HEAD
          git diff --exit-code
